<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预期差详细页 - {{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #e2e8f0; }
        .header {
            background: linear-gradient(135deg, rgba(56,189,248,0.1) 0%, rgba(139,92,246,0.1) 100%);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .header h1 { font-size: 24px; margin-bottom: 12px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .detail-section {
            background: rgba(30,41,59,0.5);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .detail-section h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-section ul { padding-left: 20px; }
        .detail-section li { margin-bottom: 8px; color: #cbd5e1; }
        .detail-section table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        .detail-section th {
            background: rgba(56,189,248,0.1);
            padding: 10px;
            text-align: left;
            border: 1px solid rgba(148,163,184,0.2);
        }
        .detail-section td {
            padding: 10px;
            border: 1px solid rgba(148,163,184,0.2);
            color: #cbd5e1;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 8px;
        }
        .tag.policy { background: rgba(239,68,68,0.2); color: #f87171; }
        .tag.highlight { background: rgba(245,158,11,0.2); color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-btn" onclick="history.back()">← 返回清单</div>
        
        <div class="header">
            <h1>{{ICON}} {{TITLE}}</h1>
            <p>相关标的：{{STOCKS}}</p>
            <p style="color:#ef4444;font-size:12px;margin-top:8px;">⚠️ 不是买卖依据，不要轻信！买者自负！</p>
        </div>

        <div class="detail-section">
            <h3>📊 当前市场共识</h3>
            <ul>
                {{CONSENSUS_LIST}}
            </ul>
        </div>

        <div class="detail-section">
            <h3>📋 实际信息</h3>
            <ul>
                {{FACTS_LIST}}
            </ul>
        </div>

        <div class="detail-section">
            <h3>🔍 预期差分析</h3>
            <table>
                <tr>
                    <th style="width:20%">维度</th>
                    <th style="width:40%">市场假设</th>
                    <th style="width:40%">实际情况</th>
                </tr>
                {{ANALYSIS_ROWS}}
            </table>
        </div>

        <div class="detail-section">
            <h3>🎯 预期差大小：<span style="color:{{SIZE_COLOR}};">{{STARS}}</span></h3>
            <ul>
                {{CONCLUSION_LIST}}
            </ul>
        </div>

        <div class="detail-section">
            <h3>✅ 验证节点</h3>
            <ul>
                {{VALIDATION_LIST}}
            </ul>
        </div>
    </div>
</body>
</html>
