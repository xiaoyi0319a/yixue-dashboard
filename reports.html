<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 个股分析报告库 | 羿学交易智囊团</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a2332 100%);
            color: #e0e6ed;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #2d3a4f;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(90deg, #00d4ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle {
            color: #8b9dc3;
            font-size: 1em;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #2d3a4f;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: #58a6ff;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #1a2332;
            border: 1px solid #2d3a4f;
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 1em;
            outline: none;
        }
        .search-box input:focus {
            border-color: #a371f7;
        }
        .search-box input::placeholder {
            color: #6b7b8f;
        }
        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            border: 1px solid #2d3a4f;
            background: #1a2332;
            color: #8b9dc3;
            transition: all 0.3s;
        }
        .filter-tag:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        .filter-tag.active {
            background: rgba(163, 113, 247, 0.2);
            border-color: #a371f7;
            color: #a371f7;
        }
        .stats {
            color: #8b9dc3;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .report-card {
            background: linear-gradient(135deg, #1a2332 0%, #16213e 100%);
            border: 1px solid #2d3a4f;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .report-card:hover {
            border-color: #a371f7;
            box-shadow: 0 0 20px rgba(163, 113, 247, 0.2);
            transform: translateY(-3px);
        }
        .report-code {
            font-size: 0.85em;
            color: #58a6ff;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
        }
        .report-name {
            font-size: 1.15em;
            color: #e0e6ed;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .report-date {
            font-size: 0.8em;
            color: #6b7b8f;
            margin-bottom: 10px;
        }
        .report-tag {
            display: inline-block;
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 5px;
            margin-top: 5px;
        }
        .tag-merger { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .tag-normal { background: rgba(0, 212, 255, 0.15); color: #00d4ff; }
        .tag-vaccine { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .tag-biotech { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
        .tag-restructuring { background: rgba(163, 113, 247, 0.2); color: #a371f7; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .page-btn {
            padding: 8px 14px;
            border: 1px solid #2d3a4f;
            border-radius: 6px;
            background: #1a2332;
            color: #8b9dc3;
            cursor: pointer;
            transition: all 0.3s;
        }
        .page-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        .page-btn.active {
            background: rgba(163, 113, 247, 0.2);
            border-color: #a371f7;
            color: #a371f7;
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7b8f;
        }
        .footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid #2d3a4f;
            margin-top: 40px;
            color: #8b9dc3;
            font-size: 0.9em;
        }
        @media (max-width: 600px) {
            .report-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.6em; }
            .controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 个股分析报告库</h1>
            <p class="subtitle">羿学交易智囊团 · 已分析报告汇总 · 最后更新：2026-05-28</p>
        </div>

        <div class="nav">
            <a href="index.html">🏠 返回首页</a>
            <a href="qimen.html">🔮 奇门起盘</a>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 输入代码或名称搜索...">
            </div>
            <div class="filter-tags" id="filterTags">
                <span class="filter-tag active" data-tag="all">全部</span>
                <span class="filter-tag" data-tag="并购重组">并购重组</span>
                <span class="filter-tag" data-tag="创新药">创新药</span>
                <span class="filter-tag" data-tag="疫苗龙头">疫苗</span>
                <span class="filter-tag" data-tag="业绩拐点">业绩拐点</span>
                <span class="filter-tag" data-tag="汽车智能化">汽车智能化</span>
                <span class="filter-tag" data-tag="氢能">氢能</span>
                <span class="filter-tag" data-tag="算电协同">算电协同</span>
                <span class="filter-tag" data-tag="折叠屏">折叠屏</span>
                <span class="filter-tag" data-tag="半导体封测">半导体封测</span>
                <span class="filter-tag" data-tag="面板设备">面板设备</span>
                <span class="filter-tag" data-tag="消费电子">消费电子</span>
                <span class="filter-tag" data-tag="汽车连接器">汽车连接器</span>
            </div>
        </div>

        <div class="stats" id="stats">加载中...</div>

        <div class="report-grid" id="reportGrid"></div>
        <div class="pagination" id="pagination"></div>

        <div class="footer">
            <p>🎯 羿学交易智囊团 | 个股分析报告库</p>
            <p style="margin-top:8px; font-size:0.85em; color:#6b7b8f;">数据来源：公开市场信息 | 仅供学习交流，不构成投资建议</p>
        </div>
    </div>

    <script>
        const PAGE_SIZE = 12;
        let allReports = [];
        let filteredReports = [];
        let currentPage = 1;
        let currentTag = 'all';
        let searchQuery = '';

        // 标签样式映射
        const tagStyles = {
            '并购重组': 'tag-merger',
            '疫苗龙头': 'tag-vaccine',
            '创新药': 'tag-biotech',
            '二进制赌注': 'tag-biotech',
            '业绩拐点': 'tag-normal',
            '分析': 'tag-normal',
            '九价HPV': 'tag-restructuring'
        };

        function getTagClass(tag) {
            return tagStyles[tag] || 'tag-normal';
        }

        async function loadReports() {
            try {
                const response = await fetch('reports.json');
                allReports = await response.json();
                // 按日期倒序
                allReports.sort((a, b) => new Date(b.date) - new Date(a.date));
                applyFilters();
            } catch (e) {
                document.getElementById('reportGrid').innerHTML = 
                    '<div class="empty-state">加载失败，请刷新页面重试</div>';
            }
        }

        function applyFilters() {
            filteredReports = allReports.filter(r => {
                const matchTag = currentTag === 'all' || r.tags.includes(currentTag);
                const matchSearch = !searchQuery || 
                    r.code.includes(searchQuery) || 
                    r.name.includes(searchQuery);
                return matchTag && matchSearch;
            });
            currentPage = 1;
            render();
        }

        function render() {
            const grid = document.getElementById('reportGrid');
            const stats = document.getElementById('stats');
            const pagination = document.getElementById('pagination');

            // 统计
            stats.textContent = `共 ${filteredReports.length} 只 / 总计 ${allReports.length} 只`;

            // 分页
            const totalPages = Math.ceil(filteredReports.length / PAGE_SIZE) || 1;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageReports = filteredReports.slice(start, start + PAGE_SIZE);

            // 渲染卡片
            if (pageReports.length === 0) {
                grid.innerHTML = '<div class="empty-state">没有找到匹配的报告</div>';
            } else {
                grid.innerHTML = pageReports.map(r => {
                    const tagsHtml = r.tags.map(t => 
                        `<span class="report-tag ${getTagClass(t)}">${t}</span>`
                    ).join('');
                    return `
                        <a href="${r.file}" class="report-card">
                            <div class="report-code">${r.code}</div>
                            <div class="report-name">${r.name}</div>
                            <div class="report-date">${r.date}</div>
                            ${tagsHtml}
                        </a>
                    `;
                }).join('');
            }

            // 渲染分页按钮
            if (totalPages <= 1) {
                pagination.innerHTML = '';
            } else {
                let pagesHtml = '';
                // 上一页
                pagesHtml += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">←</button>`;
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                        pagesHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
                    } else if (i === currentPage - 2 || i === currentPage + 2) {
                        pagesHtml += `<span style="color:#6b7b8f;padding:8px;">...</span>`;
                    }
                }
                // 下一页
                pagesHtml += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">→</button>`;
                pagination.innerHTML = pagesHtml;
            }
        }

        function goPage(p) {
            currentPage = p;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 搜索
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            applyFilters();
        });

        // 标签筛选
        document.getElementById('filterTags').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-tag')) {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentTag = e.target.dataset.tag;
                applyFilters();
            }
        });

        // 初始化
        loadReports();
    </script>
</body>
</html>
