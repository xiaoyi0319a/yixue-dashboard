    <script>
        // 基础数据
        const TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

        // 六十甲子
        const JIAZI = [];
        for (let i = 0; i < 60; i++) {
            JIAZI.push(TIANGAN[i % 10] + DIZHI[i % 12]);
        }

        // 六甲旬首
        const XUNSHOU_MAP = {};
        const XUNSHOU_LIST = ['甲子', '甲戌', '甲申', '甲午', '甲辰', '甲寅'];
        for (let i = 0; i < 60; i++) {
            const xunIndex = Math.floor(i / 10);
            XUNSHOU_MAP[JIAZI[i]] = XUNSHOU_LIST[xunIndex];
        }

        // 旬首地支 - 修正为旬首六仪所在的宫位号
        // 甲辰壬在坎一宫，所以'甲辰': 1
        // 需要根据定局动态计算，这里先修正甲辰的值
        const XUNSHOU_DIZHI = {'甲子': 1, '甲戌': 6, '甲申': 7, '甲午': 9, '甲辰': 1, '甲寅': 8};

        // 马星（时支定）- hour是1-12，对应子丑寅...
        // 申子辰马在寅, 寅午戌马在申, 巳酉丑马在亥, 亥卯未马在巳
        const MAXING = {
            1: 3,   // 子→寅
            2: 12,  // 丑→亥
            3: 9,   // 寅→申
            4: 6,   // 卯→巳
            5: 3,   // 辰→寅
            6: 12,  // 巳→亥
            7: 9,   // 午→申
            8: 6,   // 未→巳
            9: 3,   // 申→寅
            10: 12, // 酉→亥
            11: 9,  // 戌→申
            12: 6   // 亥→巳
        };

        // 击刑
        const JIXING = {
            '甲': 3, // 震宫
            '戊': 3,
            '己': 2, // 坤宫
            '庚': 8, // 艮宫
            '辛': 8,
            '壬': 0, // 巽宫（无此宫，实际在4宫）
            '癸': 0,
            '乙': null, // 无
            '丙': null,
            '丁': null
        };

        // 门迫（门克宫）
        const MENKE = {
            '休门': [2, 5, 8], // 克土宫
            '生门': [1], // 克水宫
            '伤门': [6, 7], // 克金宫
            '杜门': [6, 7], // 克金宫
            '景门': [1], // 克水宫
            '死门': [1], // 克水宫
            '惊门': [3, 4], // 克木宫
            '开门': [3, 4] // 克木宫
        };

        // 宫位五行
        const GONG_WUXING = {1: '水', 2: '土', 3: '木', 4: '木', 5: '土', 6: '金', 7: '金', 8: '土', 9: '火'};

        // 门五行
        const MEN_WUXING = {
            '休门': '水', '生门': '土', '伤门': '木', '杜门': '木',
            '景门': '火', '死门': '土', '惊门': '金', '开门': '金'
        };

        // 入墓
        const RUMU = {
            '乙': 2, '丙': 6, '丁': 2, '戊': 6, '己': 6,
            '庚': 2, '辛': 6, '壬': 4, '癸': 2
        };

        // 空亡
        const KONGWANG = {
            '甲子': [10, 11], '甲戌': [8, 9], '甲申': [6, 7],
            '甲午': [4, 5], '甲辰': [2, 3], '甲寅': [0, 1]
        };

        // 吉格
        const JIGE = {
            '戊丙': '青龙返首', '丙戊': '飞鸟跌穴', '辛乙': '白虎猖狂',
            '乙辛': '青龙逃走', '癸丁': '腾蛇夭矫', '丁癸': '朱雀投江'
        };

        // ==================== 万年历自动计算（移植自wan_nian_li.py）====================

        // 基准日期：2025年9月1日 = 癸酉日
        const BASE_YEAR = 2025;
        const BASE_MONTH = 9;
        const BASE_DAY = 1;
        const BASE_GAN_INDEX = 9;  // 癸
        const BASE_ZHI_INDEX = 9;  // 酉

        // 各月天数（非闰年）
        const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        // 判断闰年
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        // 获取某月天数
        function getMonthDays(year, month) {
            if (month === 2 && isLeapYear(year)) {
                return 29;
            }
            return MONTH_DAYS[month - 1];
        }

        // 计算两个日期之间的天数差（目标日期 - 基准日期）
        function daysBetween(year1, month1, day1, year2, month2, day2) {
            // 如果目标日期在基准日期之前，交换参数并取负数
            if (year2 < year1 || (year2 === year1 && month2 < month1) ||
                (year2 === year1 && month2 === month1 && day2 < day1)) {
                return -daysBetween(year2, month2, day2, year1, month1, day1);
            }

            let days = 0;

            // 同年同月
            if (year1 === year2 && month1 === month2) {
                return day2 - day1;
            }

            // 同年不同月
            if (year1 === year2) {
                days += getMonthDays(year1, month1) - day1;
                for (let m = month1 + 1; m < month2; m++) {
                    days += getMonthDays(year1, m);
                }
                days += day2;
                return days;
            }

            // 不同年（year1 < year2）
            days += getMonthDays(year1, month1) - day1;
            for (let m = month1 + 1; m <= 12; m++) {
                days += getMonthDays(year1, m);
            }

            for (let y = year1 + 1; y < year2; y++) {
                days += isLeapYear(y) ? 366 : 365;
            }

            for (let m = 1; m < month2; m++) {
                days += getMonthDays(year2, m);
            }
            days += day2;

            return days;
        }

        // 计算日干支（V3.70 - 支持早子时修正）
        function getDayGanZhi(year, month, day, hour = 12, minute = 0) {
            // 早子时修正：23:00-00:00属当天，00:00-01:00属次日
            let adjustedYear = year;
            let adjustedMonth = month;
            let adjustedDay = day;
            
            if (hour === 0) {
                // 00:00-00:59 夜子时，日柱用次日
                const nextDay = new Date(year, month - 1, day + 1);
                adjustedYear = nextDay.getFullYear();
                adjustedMonth = nextDay.getMonth() + 1;
                adjustedDay = nextDay.getDate();
            }
            // hour === 23 时（23:00-23:59 早子时），日柱保持当天
            
            const diff = daysBetween(BASE_YEAR, BASE_MONTH, BASE_DAY, adjustedYear, adjustedMonth, adjustedDay);
            const ganIndex = ((BASE_GAN_INDEX + diff) % 10 + 10) % 10;
            const zhiIndex = ((BASE_ZHI_INDEX + diff) % 12 + 12) % 12;
            return {
                gan: ganIndex,
                zhi: zhiIndex,
                ganZhi: TIANGAN[ganIndex] + DIZHI[zhiIndex]
            };
        }

        // ==================== 节气精确计算（Cope公式）====================
        // 1900-2100年全覆盖，精度±1分钟

        // Cope公式：计算太阳黄经，进而确定节气时刻
        // 节气黄经：立春315°，雨水330°，惊蛰345°，春分0°/360°，清明15°... 每15°一个节气
        const JIEQI_LONGITUDE = {
            '小寒': 285, '大寒': 300, '立春': 315, '雨水': 330, '惊蛰': 345, '春分': 0,
            '清明': 15, '谷雨': 30, '立夏': 45, '小满': 60, '芒种': 75, '夏至': 90,
            '小暑': 105, '大暑': 120, '立秋': 135, '处暑': 150, '白露': 165, '秋分': 180,
            '寒露': 195, '霜降': 210, '立冬': 225, '小雪': 240, '大雪': 255, '冬至': 270
        };

        // 将角度转为0-360范围
        function normalizeAngle(angle) {
            while (angle < 0) angle += 360;
            while (angle >= 360) angle -= 360;
            return angle;
        }

        // Cope公式：计算太阳黄经（简化版，精度±1分钟）
        // 基于VSOP87简化，适用于1900-2100年
        function getSunLongitude(year, month, day, hour = 0, minute = 0) {
            // 儒略日计算
            const jd = getJulianDay(year, month, day, hour, minute);
            const t = (jd - 2451545.0) / 36525; // 自J2000起的儒略世纪数
            
            // 太阳平黄经
            const L0 = 280.46646 + 36000.76983 * t + 0.0003032 * t * t;
            
            // 太阳平近点角
            const M = 357.52911 + 35999.05029 * t - 0.0001537 * t * t;
            const Mrad = M * Math.PI / 180;
            
            // 中心差
            const C = (1.914602 - 0.004817 * t - 0.000014 * t * t) * Math.sin(Mrad)
                    + (0.019993 - 0.000101 * t) * Math.sin(2 * Mrad)
                    + 0.000289 * Math.sin(3 * Mrad);
            
            // 太阳黄经
            let sunLon = L0 + C;
            sunLon = normalizeAngle(sunLon);
            
            // 岁差修正
            const omega = 125.04 - 1934.136 * t;
            const correction = 0.00569 + 0.00478 * Math.sin(omega * Math.PI / 180);
            sunLon = normalizeAngle(sunLon + correction);
            
            return sunLon;
        }

        // 计算儒略日
        function getJulianDay(year, month, day, hour = 0, minute = 0) {
            if (month <= 2) {
                year -= 1;
                month += 12;
            }
            const A = Math.floor(year / 100);
            const B = 2 - A + Math.floor(A / 4);
            const dayFraction = (hour + minute / 60) / 24;
            return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + dayFraction + B - 1524.5;
        }

        // 二分搜索：找到节气精确时刻
        function findJieQiMoment(year, targetLon, startMonth = 1, startDay = 1) {
            // 搜索范围：从年初开始约30天
            let left = getJulianDay(year, startMonth, startDay, 0, 0);
            let right = left + 30;
            
            // 获取边界黄经
            const leftDate = julianDayToDate(left);
            const leftLon = getSunLongitude(leftDate.year, leftDate.month, leftDate.day, leftDate.hour, leftDate.minute);
            
            // 计算目标角度差
            let diff = normalizeAngle(targetLon - leftLon);
            if (diff > 180) diff -= 360; // 取最短路径
            
            // 二分搜索
            for (let i = 0; i < 20; i++) {
                const mid = (left + right) / 2;
                const midDate = julianDayToDate(mid);
                const midLon = getSunLongitude(midDate.year, midDate.month, midDate.day, midDate.hour, midDate.minute);
                
                const midDiff = normalizeAngle(targetLon - midLon);
                
                if (Math.abs(midDiff) < 0.001 || right - left < 1 / 1440) {
                    // 精度足够（约1分钟）
                    return midDate;
                }
                
                if ((diff > 0 && midDiff > 0) || (diff < 0 && midDiff < 0)) {
                    left = mid;
                } else {
                    right = mid;
                }
            }
            
            return julianDayToDate((left + right) / 2);
        }

        // 儒略日转日期
        function julianDayToDate(jd) {
            jd += 0.5;
            const Z = Math.floor(jd);
            const F = jd - Z;
            let A = Z;
            if (Z >= 2299161) {
                const alpha = Math.floor((Z - 1867216.25) / 36524.25);
                A = Z + 1 + alpha - Math.floor(alpha / 4);
            }
            const B = A + 1524;
            const C = Math.floor((B - 122.1) / 365.25);
            const D = Math.floor(365.25 * C);
            const E = Math.floor((B - D) / 30.6001);
            
            const day = B - D - Math.floor(30.6001 * E);
            const month = E < 14 ? E - 1 : E - 13;
            const year = month > 2 ? C - 4716 : C - 4715;
            
            // 计算时分
            const hourFraction = F * 24;
            const hour = Math.floor(hourFraction);
            const minute = Math.floor((hourFraction - hour) * 60);
            
            return {year, month, day, hour, minute};
        }

        }

                }));
                jieqiList.sort((a, b) => (a.month * 1000000 + a.day * 10000 + a.hour * 100 + a.minute) - (b.month * 1000000 + b.day * 10000 + b.hour * 100 + b.minute));
                
                const currentTime = month * 1000000 + day * 10000 + hour * 100 + minute;
                for (let i = jieqiList.length - 1; i >= 0; i--) {
                    const jq = jieqiList[i];
                    const jqTime = jq.month * 1000000 + jq.day * 10000 + jq.hour * 100 + jq.minute;
                    if (jqTime <= currentTime) return jq;

            // 备用：使用Cope近似
            const jieQiList = getYearJieQi(year);
            const currentTime = month * 1000000 + day * 10000 + hour * 100 + minute;
            let prevJieQi = null;
            for (const [name, moment] of Object.entries(jieQiList)) {

            const result = prevJieQi || Object.entries(jieQiList).pop()[1];
            const yangJieQi = ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种'];

            };

            // 九星排列顺序（蓬→任→冲→辅→英→芮→柱→心）
            const starArrangeOrder = ['天蓬', '天任', '天冲', '天辅', '天英', '天芮', '天柱', '天心'];

            // 修正：值符星落在zhiFuGong，其他星按顺序排列
            // zhiFuGongIndex 和 zhiFuStarIndex 已在上方定义，这里直接使用

            // 天盘干计算（移位法）：
            // 1. 获取地盘干按顺时针九宫顺序（从值符星位置开始）
            // 2. 找到旬首六仪位置，把前面的移到后面
            const clockwiseOrder = [3, 4, 9, 2, 7, 6, 1, 8];
            // zhiFuGongIndex 已在上文定义
            // liuYi已在上方定义

            // 按顺时针顺序收集地盘干（从值符星位置开始）
            const diPanGanOrder = [];
            for (let i = 0; i < 8; i++) {
                const gongIdx = (zhiFuGongIndex + i) % 8;
                const gong = clockwiseOrder[gongIdx];
                diPanGanOrder.push(diPan[gong] || '');
            }

            // 找到旬首六仪位置，移位
            const liuYiIndex = diPanGanOrder.indexOf(liuYi);
            let tianPanGanOrder = [];
            if (liuYiIndex !== -1) {
                tianPanGanOrder = diPanGanOrder.slice(liuYiIndex).concat(diPanGanOrder.slice(0, liuYiIndex));
            } else {
                tianPanGanOrder = diPanGanOrder; // fallback
            }

            // 修正：九星排列 - 值符星落在zhiFuGong，其他星按蓬→任→冲→辅→英→芮→柱→心顺序
            const starAtGong = {}; // 记录每个宫对应的星
            for (let i = 0; i < 8; i++) {
                // 从值符星开始，按顺序排列到各个宫位
                // i=0时，starArrangeOrder[(zhiFuStarIndex + 0) % 8] 落在 zhiFuGong
                // i=1时，starArrangeOrder[(zhiFuStarIndex + 1) % 8] 落在 zhiFuGong 的下一个宫位（顺时针）
                const gongIdx = (zhiFuGongIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIdx];
                if (gong === 5) continue;

                const star = starArrangeOrder[(zhiFuStarIndex + i) % 8];
                let starDisplay = star;
                if (star === '天芮') {
                    starDisplay = '芮禽';
                }

                starAtGong[gong] = starDisplay;
            }

            // 天盘干按顺时针九宫顺序（从zhiFuGong开始）分配
            for (let i = 0; i < 8; i++) {
                // 从zhiFuGong开始，按顺时针顺序
                const gongIdx = (zhiFuGongIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIdx];
                if (gong === 5) continue;

                // tianPanGanOrder[0]是癸，应该给zhiFuGong
                const gan = tianPanGanOrder[i] || '';

                tianPan[gong] = {
                    star: starAtGong[gong],
                    gan: gan
                };
            }

            return {tianPan, hourGanGong};
        }

        // 排天盘干（已在paiTianPan中完成，此函数保留以兼容调用）
        function paiTianPanGan(tianPan, zhiFuInfo, diPan, isYang) {
            // 天盘干已在paiTianPan中设置完成，这里直接返回
            return tianPan;
        }

        // 排八神
        function paiBaShen(zhiFuGong, isYang) {
            const baShen = {};
            const shenOrder = isYang ? BA_SHEN_YANG : BA_SHEN_YIN;
            const zhiFuIndex = CLOCKWISE_ORDER.indexOf(zhiFuGong);
            
            console.log('=== paiBaShen 调试 ===');
            console.log('zhiFuGong:', zhiFuGong, 'zhiFuIndex:', zhiFuIndex);
            console.log('isYang:', isYang, 'shenOrder:', shenOrder);
            console.log('CLOCKWISE_ORDER:', CLOCKWISE_ORDER);

            for (let i = 0; i < 8; i++) {
                // 正确规则：阳遁顺时针，阴遁逆时针
                const gongIndex = isYang ? (zhiFuIndex + i) % 8 : (zhiFuIndex - i + 8) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                baShen[gong] = shenOrder[i];
                console.log(`i=${i}, gongIndex=${gongIndex}, gong=${gong}, shen=${shenOrder[i]}`);
            }
            
            console.log('baShen:', baShen);

            return baShen;
        }

        // 排八门（按老师规则：旬首地支序号=旬首宫，地支顺序阳顺阴逆）
        function paiBaMen(zhiFuInfo, hourZhi, isYang) {
            const baMen = {};
            const menOrder = ['休门', '生门', '伤门', '杜门', '景门', '死门', '惊门', '开门'];
            const zhiShiIndex = menOrder.indexOf(zhiFuInfo.zhiShiMen);

            // 标准地支顺序
            const standardDiZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

            // 获取旬首地支（如"甲寅"取"寅"）
            const xunShou = zhiFuInfo.xunShou.slice(0, 2); // "甲寅"
            const xunShouDiZhi = xunShou[1]; // "寅"
            const hourZhiName = standardDiZhi[hourZhi - 1]; // hourZhi 1-12 转地支名

            // 旬首地支序号 = 旬首宫宫位号（中五宫寄坤二宫）
            let xunShouGong = zhiFuInfo.xunShouGong;
            if (xunShouGong === 5) {
                xunShouGong = 2; // 中五宫寄坤二宫
            }

            // 计算从旬首地支到时辰地支的步数（在12地支中的位置差）
            const xunShouIdx = standardDiZhi.indexOf(xunShouDiZhi);
            const hourIdx = standardDiZhi.indexOf(hourZhiName);
            let steps;
            if (isYang) {
                // 阳遁顺行
                steps = (hourIdx - xunShouIdx + 12) % 12;
            } else {
                // 阴遁逆行
                steps = (xunShouIdx - hourIdx + 12) % 12;
            }
            
            // 规则：值使门落宫按数字顺序（1-9循环）走步数，不跳过中五宫

            // 从旬首宫开始，按九宫数字顺序走steps步（不跳过中五宫）
            // 数字顺序：1坎→2坤→3震→4巽→5中→6乾→7兑→8艮→9离（循环）
            const numOrder = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            let currentIdx = numOrder.indexOf(xunShouGong);

            for (let i = 0; i < steps; i++) {
                if (isYang) {
                    currentIdx = (currentIdx + 1) % 9;
                } else {
                    currentIdx = (currentIdx - 1 + 9) % 9;
                }
                // 不再跳过中五宫
            }

            const zhiShiGong = numOrder[currentIdx];

            // 从值使门落宫开始，顺时针排八门
            const startIndex = CLOCKWISE_ORDER.indexOf(zhiShiGong);

            for (let i = 0; i < 8; i++) {
                const gongIndex = (startIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                const menIdx = (zhiShiIndex + i) % 8;
                baMen[gong] = menOrder[menIdx];
            }

            return {baMen, zhiShiGong};
        }

        // 排隐干（V3.80 - 修正：正确计算戊的起始位置，使时干落在目标宫）
        // 规则：
        // 1. 如果值使门落宫地盘干 = 起局时辰天干（情况一）：时干在中五宫（序号5）
        // 2. 如果值使门落宫地盘干 ≠ 起局时辰天干（情况二）：时干在值使门落宫
        // 阳遁顺排：戊→己→庚→辛→壬→癸→丁→丙→乙，按数字顺序1→9
        // 阴遁逆排：戊→己→庚→辛→壬→癸→丁→丙→乙，按数字顺序9→1
        function paiYinGan(zhiShiGong, diPan, hourGanZhi, isYang, xunShou, zhiFuGong) {
            const yinGan = {};
            let hourGan = hourGanZhi[0]; // 起局时辰的天干
            
            // 处理甲隐遁：如果时干是甲，用旬首的六仪代替
            if (hourGan === '甲') {
                hourGan = xunShou.slice(2);
            }
            
            // 隐干顺序：戊(0)→己(1)→庚(2)→辛(3)→壬(4)→癸(5)→丁(6)→丙(7)→乙(8)
            const yinGanOrder = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
            
            // 数字顺序：1坎→2坤→3震→4巽→5中→6乾→7兑→8艮→9离
            const numOrder = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            
            // 值使门落宫的地盘干
            const zhiShiDiPanGan = diPan[zhiShiGong];
            
            // 判断值使门落宫地盘干是否等于起局时辰天干
            const isSameGan = zhiShiDiPanGan && zhiShiDiPanGan.includes(hourGan);
            
            // 确定时干应该在哪个宫（目标宫）
            const targetGong = isSameGan ? 5 : zhiShiGong;
            
            // 时干在yinGanOrder中的索引
            const hourGanIdx = yinGanOrder.indexOf(hourGan);
            
            // 计算戊应该在哪个宫（倒推）
            // 阳遁：从戊开始顺排到目标宫，正好落在时干
            // 阴遁：从戊开始逆排到目标宫，正好落在时干
            let wuGongIdx; // 戊在numOrder中的索引
            if (isYang) {
                // 阳遁：目标宫索引 = (戊索引 + 时干索引) % 9
                // 所以：戊索引 = (目标宫索引 - 时干索引 + 9) % 9
                wuGongIdx = (numOrder.indexOf(targetGong) - hourGanIdx + 9) % 9;
            } else {
                // 阴遁：目标宫索引 = (戊索引 - 时干索引 + 9) % 9
                // 所以：戊索引 = (目标宫索引 + 时干索引) % 9
                wuGongIdx = (numOrder.indexOf(targetGong) + hourGanIdx) % 9;
            }
            
            // 从戊开始排天干
            for (let i = 0; i < 9; i++) {
                let gongIdx;
                if (isYang) {
                    // 阳遁：数字顺序1→9
                    gongIdx = (wuGongIdx + i) % 9;
                } else {
                    // 阴遁：数字顺序9→1（从戊索引反向）
                    gongIdx = (wuGongIdx - i + 9) % 9;
                }
                const gongNum = numOrder[gongIdx];
                const gan = yinGanOrder[i]; // 从戊(0)开始
                yinGan[gongNum] = gan;
            }
            
            return yinGan;
        }

        // 检测四害
        function checkSiHai(gong, diPanGan, tianPanGan, men, star, yinGan) {
            const sihai = [];

            // 门迫
            if (men && MENKE[men] && MENKE[men].includes(gong)) {
                sihai.push('门迫');
            }

            // 击刑
            if (tianPanGan && JIXING[tianPanGan] === gong) {
                sihai.push('击刑');
            }

            // 入墓
            if (tianPanGan && RUMU[tianPanGan] === gong) {
                sihai.push('入墓');
            }

            // 伏吟（天盘干=地盘干）
            if (tianPanGan && diPanGan && tianPanGan === diPanGan) {
                sihai.push('伏吟');
            }

            return sihai;
        }

        // 检测格局
        function checkGeJu(tianPanGan, diPanGan) {
            if (!tianPanGan || !diPanGan) return null;
            const key = tianPanGan + diPanGan;
            return JIGE[key] || null;
        }

        // 根据小时和分钟计算时辰（1-12）
        function getShiChen(hours, minutes) {
            // 时辰转换：每个时辰2小时，从23点开始
            // 23-1: 子时(1), 1-3: 丑时(2), 3-5: 寅时(3)...
            // 23点和0点都属于子时
            const totalMinutes = hours * 60 + minutes;
            // 23:00 = 1380分钟，从23:00开始算一个新周期
            // (1380 + 120 - totalMinutes) % 1440 / 120
            let shiChen;
            if (hours === 23) {
                shiChen = 1; // 子时
            } else {
                shiChen = Math.floor((hours + 1) / 2) % 12 + 1;
            }
            return shiChen;
        }

        // 主排盘函数（V3.70 - 支持精确时分和早子时）
        function qiPan() {
            const dateInput = document.getElementById('date').value;
            const [y, m, d] = dateInput.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            
            // 从时间输入框获取小时和分钟
            const timeInput = document.getElementById('time').value;
            let hours = 12, minutes = 0;
            if (timeInput) {
                const [h, min] = timeInput.split(':').map(Number);
                hours = h;
                minutes = min || 0;
            }
            
            // 计算时辰
            const hour = getShiChen(hours, minutes);
            
            // 计算实际时辰（用于时柱）
            // 子时分早子时(23-24)和夜子时(0-1)
            let actualHourZhi = hour - 1; // 0-11
            if (hour === 1) {
                // 子时，需要根据分钟判断是早子还是夜子
                // 23:00-23:59是早子(时柱为子，日柱当天)
                // 00:00-00:59是夜子(时柱为子，日柱次日)
                // hour=1表示选择了子时，需要额外判断
                if (minutes < 30) {
                    // 默认按早子时处理，用户可以通过选择日期来区分
                }
            }
            
            // 获取精确节气（到分钟）
            const jieQi = getJieQi(y, m, d, actualHourZhi === 0 ? 0 : (actualHourZhi + 1) * 2, minutes);
            
            // 判断月柱是否需要按下一个节气
            const jieQiTime = jieQi.month * 1000000 + jieQi.day * 10000 + jieQi.hour * 100 + jieQi.minute;
            const currentTime = m * 1000000 + d * 10000 + (actualHourZhi === 0 ? 0 : actualHourZhi + 1) * 2 * 100 + minutes;
            
            // 如果当前时间已过节气时刻，使用下一个节气
            let effectiveJieQi = jieQi;
            if (currentTime >= jieQiTime && jieQi.nextJieQi) {
                effectiveJieQi = {name: jieQi.nextJieQi.name, type: jieQi.nextJieQi.type};
            }

            // 四柱（传入时分）
            const yearGZ = getYearGanZhi(y, effectiveJieQi.name !== '立春' && effectiveJieQi.name !== '雨水' && effectiveJieQi.name !== '惊蛰');
            const monthGZ = getMonthGanZhi(y, m, d, actualHourZhi === 0 ? 0 : (actualHourZhi + 1) * 2, minutes);
            const dayGZ = getDayGanZhi(y, m, d, actualHourZhi === 0 ? 23 : (actualHourZhi + 1) * 2 - 1, minutes);
            const hourGZ = getHourGanZhi(dayGZ.gan, actualHourZhi);

            // 显示四柱
            const sizhuRow = document.getElementById('sizhuRow');
            sizhuRow.innerHTML = `
                <div class="sizhu-item"><div class="label">年柱</div><div class="value">${yearGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">月柱</div><div class="value">${monthGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">日柱</div><div class="value">${dayGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">时柱</div><div class="value">${hourGZ.ganZhi}</div></div>
            `;

            // 定局
            const juInfo = determineJuShu(effectiveJieQi, dayGZ.ganZhi);

            // 排地盘
            const diPan = paiDiPan(juInfo.ju, juInfo.isYang);

            // 找值符值使
            console.log('qiPan - hourGZ.ganZhi:', hourGZ.ganZhi);
            const zhiFuInfo = findZhiFuZhiShi(hourGZ.ganZhi, diPan);

            // 排九星（先排星，不排天盘干）
            const {tianPan, hourGanGong} = paiTianPan(hourGZ.ganZhi, diPan, zhiFuInfo, juInfo.isYang);

            // 排八神（从值符实际落宫开始）
            const baShen = paiBaShen(zhiFuInfo.zhiFuGong, juInfo.isYang);

            // 排八门
            const {baMen, zhiShiGong} = paiBaMen(zhiFuInfo, hour, juInfo.isYang);

            // 排天盘干（在九星和八门之后）
            paiTianPanGan(tianPan, zhiFuInfo, diPan, juInfo.isYang);

            // 排隐干（传入旬首和值符落宫以处理甲隐遁和情况一）
            const yinGan = paiYinGan(zhiShiGong, diPan, hourGZ.ganZhi, juInfo.isYang, zhiFuInfo.xunShou, zhiFuInfo.zhiFuGong);

            // 马星
            const maXingZhi = MAXING[hour]; // 1-12序号
            const maXingGong = Object.keys(diPan).find(k => DIZHI.indexOf(diPan[k]) + 1 === maXingZhi);

            // 保存数据
            currentPanData = {
                sizhu: {year: yearGZ, month: monthGZ, day: dayGZ, hour: hourGZ},
                jieQi,
                juInfo,
                zhiFuInfo,
                diPan,
                tianPan,
                baShen,
                baMen,
                yinGan,
                maXing: DIZHI[maXingZhi - 1],
                isYang: juInfo.isYang
            };

            // 显示信息
            const jieqiText = jieQi.hour !== undefined 
                ? `${jieQi.name} (${jieQi.month}月${jieQi.day}日 ${String(jieQi.hour).padStart(2,'0')}:${String(jieQi.minute).padStart(2,'0')})`
                : jieQi.name;
            document.getElementById('jieqi').textContent = jieqiText;
            document.getElementById('jushu').textContent = `${juInfo.type}${juInfo.ju}局`;
            document.getElementById('xunshou').textContent = zhiFuInfo.xunShou;
            document.getElementById('zhifu').textContent = zhiFuInfo.zhiFuXing;
            document.getElementById('zhishi').textContent = zhiFuInfo.zhiShiMen;
            document.getElementById('maxing').textContent = DIZHI[maXingZhi - 1];

            document.getElementById('infoSection').classList.add('active');

            // 渲染九宫
            renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo);

            document.getElementById('panSection').classList.add('active');
        }

        // 渲染盘面
        function renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo) {
            const container = document.getElementById('panContainer');
            container.innerHTML = '';

            const gongPositions = [4, 9, 2, 3, 5, 7, 8, 1, 6];

            gongPositions.forEach(gongNum => {

                const tp = tianPan[gongNum] || {};
                const star = tp.star || '';
                const tpGan = tp.gan || '';
                const dpGan = diPan[gongNum] || '';

                const shen = baShen[gongNum] || '';
                const men = baMen[gongNum] || '';
                // 修复：同时尝试数字和字符串类型的键
                const yg = yinGan[gongNum] || yinGan[String(gongNum)] || '';

                // 检测四害
                const sihai = checkSiHai(gongNum, dpGan, tpGan, men, star, yg);
                const geju = checkGeJu(tpGan, dpGan);

                if (sihai.includes('门迫')) gong.classList.add('menpo');
                if (sihai.includes('击刑') || sihai.includes('入墓')) gong.classList.add('jixing');
                if (gongNum === zhiFuInfo.zhiFuGong) gong.classList.add('zhifu');

                // 新布局：
                // 第一行：八神
                // 第二行：隐干 | 九星 | 天盘干
                // 第三行：八门 | 地盘干

                gong.innerHTML = `
                    <div class="row1">${shen}</div>
                    <div class="row2">
                        <span class="yg-left">${yg}</span>
                        <span class="star-center">${star}</span>
                        <span class="tp-right">${tpGan}${sihai.includes('击刑') ? '刑' : ''}${sihai.includes('入墓') ? '墓' : ''}</span>
                    </div>
                    <div class="row3">
                        <span class="men-left ${sihai.includes('门迫') ? 'menpo' : ''}">${men}${sihai.includes('门迫') ? '迫' : ''}</span>
                        <span class="dp-right">${dpGan}</span>
                    </div>
                    ${geju ? `<div class="geju-new">${geju}</div>` : ''}
                `;

                container.appendChild(gong);
            });
        }

        // 导出盘面
        function exportPan() {
            if (!currentPanData) {
                alert('请先起盘！');
                return;
            }

            const data = currentPanData;
            const gongNames = {1: '坎一宫(北)', 2: '坤二宫(西南)', 3: '震三宫(东)', 4: '巽四宫(东南)',
                              5: '中五宫', 6: '乾六宫(西北)', 7: '兑七宫(西)', 8: '艮八宫(东北)', 9: '离九宫(南)'};
            const gongOrder = [4, 9, 2, 3, 5, 7, 8, 1, 6]; // 九宫格显示顺序

            let output = `==============================================\n`;

            output += `==============================================\n`;
            output += `导出时间: ${new Date().toLocaleString()}\n\n`;

            output += `【四柱八字】\n`;

            output += `日柱: ${data.sizhu.day.ganZhi} (日干:${data.sizhu.day.gan})\n`;
            output += `时柱: ${data.sizhu.hour.ganZhi} (时干:${data.sizhu.hour.gan})\n\n`;

            output += `【局信息】\n`;
            output += `节气: ${data.jieQi.name}\n`;
            output += `局数: ${data.juInfo.type}${data.juInfo.ju}局\n`;
            output += `旬首: ${data.zhiFuInfo.xunShou}\n`;
            output += `值符: ${data.zhiFuInfo.zhiFuXing}\n`;
            output += `值使: ${data.zhiFuInfo.zhiShiMen}\n`;
            output += `马星: ${data.maXing}\n\n`;

            output += `【交易用神速查】\n`;
            output += `日干(股价): ${data.sizhu.day.gan} - 需查所在宫位\n`;
            output += `时干(时机): ${data.sizhu.hour.gan} - 需查所在宫位\n`;
            output += `值符(大势): ${data.zhiFuInfo.zhiFuXing}\n`;
            output += `乙奇(买盘): 需查所在宫位\n`;
            output += `庚金(卖盘): 需查所在宫位\n\n`;

            output += `==============================================\n`;
            output += `              九宫格完整盘面\n`;
            output += `==============================================\n\n`;

            // 按九宫格顺序输出每个宫的信息
            gongOrder.forEach(gongNum => {
                const tp = data.tianPan[gongNum] || {};
                const star = tp.star || '';
                const tpGan = tp.gan || '';
                const dpGan = data.diPan[gongNum] || '';
                const shen = data.baShen[gongNum] || '';
                const men = data.baMen[gongNum] || '';
                const yg = data.yinGan[gongNum] || data.yinGan[String(gongNum)] || '';
                const isZhiFuGong = (gongNum == data.zhiFuInfo.zhiFuGong) ? ' [值符宫]' : '';

                output += `【${gongNames[gongNum]}${isZhiFuGong}】\n`;
                output += `  八神: ${shen || '无'}\n`;
                output += `  天盘: ${tpGan || '无'} (${star || '无'})\n`;
                output += `  地盘: ${dpGan || '无'}\n`;
                output += `  八门: ${men || '无'}\n`;
                output += `  隐干: ${yg || '无'}\n\n`;
            });

            output += `==============================================\n`;
            output += `【地盘干全表】\n`;
            output += `==============================================\n`;
            for (let i = 1; i <= 9; i++) {
                output += `${gongNames[i]}: ${data.diPan[i] || '无'}\n`;
            }

            console.log(output);

            // 创建下载
            const blob = new Blob([output], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `奇门排盘_${data.sizhu.day.ganZhi}_${data.sizhu.hour.ganZhi}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
