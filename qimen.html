        // 三元定局表
        const SAN_YUAN = {
            '冬至': [1, 7, 4], '小寒': [2, 8, 5], '大寒': [3, 9, 6],
            '立春': [8, 5, 2], '雨水': [9, 6, 3], '惊蛰': [1, 7, 4],
            '春分': [3, 9, 6], '清明': [4, 1, 7], '谷雨': [5, 2, 8],
            '立夏': [4, 1, 7], '小满': [5, 2, 8], '芒种': [6, 3, 9],
            '夏至': [9, 3, 6], '小暑': [8, 2, 5], '大暑': [7, 1, 4],
            '立秋': [2, 5, 8], '处暑': [1, 4, 7], '白露': [9, 3, 6],
            '秋分': [7, 1, 4], '寒露': [6, 9, 3], '霜降': [5, 8, 2],
            '立冬': [6, 9, 3], '小雪': [5, 8, 2], '大雪': [4, 7, 1]
        };
        
        // 九星
        const JIU_XING = {1: '天蓬', 8: '天任', 3: '天冲', 4: '天辅', 9: '天英', 2: '天芮', 7: '天柱', 6: '天心', 5: '天禽'};
        
        // 八门
        const BA_MEN = {1: '休门', 8: '生门', 3: '伤门', 4: '杜门', 9: '景门', 2: '死门', 7: '惊门', 6: '开门'};
        
        // 八神（阳遁顺序）
        const BA_SHEN_YANG = ['值符', '螣蛇', '太阴', '六合', '白虎', '玄武', '九地', '九天'];
        const BA_SHEN_YIN = ['值符', '九天', '九地', '玄武', '白虎', '六合', '太阴', '螣蛇'];
        
        // 宫位名称
        const GONG_NAMES = {1: '坎一', 2: '坤二', 3: '震三', 4: '巽四', 5: '中五', 6: '乾六', 7: '兑七', 8: '艮八', 9: '离九'};
        
        // 物理顺时针顺序
        const CLOCKWISE_ORDER = [1, 8, 3, 4, 9, 2, 7, 6];
        
        // 当前盘面数据
        let currentPanData = null;
        
        // 获取当前时间
        function useNow() {
            const now = new Date();
            document.getElementById('date').value = now.toISOString().split('T')[0];
            document.getElementById('hour').value = (Math.floor((now.getHours() + 1) / 2) % 12) + 1;
            document.getElementById('minute').value = now.getMinutes();
        }
        
        // 计算年干支
        function getYearGanZhi(year) {
            const gan = (year - 4) % 10;
            const zhi = (year - 4) % 12;
            return {gan, zhi, ganZhi: TIANGAN[gan] + DIZHI[zhi]};
        }
        
        // 计算日干支
        function getDayGanZhi(date) {
            const baseDate = new Date(1900, 0, 31);
            const diffTime = date.getTime() - baseDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const index = (40 + diffDays) % 60;
            return {
                gan: index % 10,
                zhi: index % 12,
                ganZhi: JIAZI[index]
            };
        }
        
        // 计算时辰干支
        function getHourGanZhi(dayGan, hourZhi) {
            // hourZhi 是 1-based (子=1..亥=12)，需要转成 0-based
            const hourZhi0 = hourZhi - 1;
            // 日上起时口诀：
            // 甲己还加甲(甲子), 乙庚丙作初(丙子), 
            // 丙辛从戊起(戊子), 丁壬庚子居(庚子),
            // 戊癸何方发, 壬子是真途(壬子)
            const startGan = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8][dayGan];
            const gan = (startGan + hourZhi0) % 10;
            return {
                gan,
                zhi: hourZhi0,
                ganZhi: TIANGAN[gan] + DIZHI[hourZhi0]
            };
        }
        
        // 计算月干支（按节气）
        function getMonthGanZhi(yearGan, jieQiName) {
            // 年上起月口诀：
            // 甲己之年丙作首(丙寅), 乙庚之岁戊为头(戊寅), 
            // 丙辛之岁寻庚上(庚寅), 丁壬壬位顺行流(壬寅),
            // 若问戊癸何方发, 甲寅之上好追求(甲寅)
            const startGan = [2, 4, 6, 8, 0, 2, 4, 6, 8, 0][yearGan]; // 正月的干
            
            // 根据节气确定月份（正月从立春/惊蛰开始）
            const jieqiToMonth = {
                '立春': 0, '雨水': 0, '惊蛰': 1, '春分': 1,
                '清明': 2, '谷雨': 2, '立夏': 3, '小满': 3,
                '芒种': 4, '夏至': 4, '小暑': 5, '大暑': 5,
                '立秋': 6, '处暑': 6, '白露': 7, '秋分': 7,
                '寒露': 8, '霜降': 8, '立冬': 9, '小雪': 9,
                '大雪': 10, '冬至': 10, '小寒': 11, '大寒': 11
            };
            
            const monthOffset = jieqiToMonth[jieQiName] || 0;
            const gan = (startGan + monthOffset) % 10;
            const zhi = (2 + monthOffset) % 12; // 正月建寅(2)
            
            return {
                gan,
                zhi,
                ganZhi: TIANGAN[gan] + DIZHI[zhi]
            };
        }
        
        // 获取节气
        function getJieQi(date) {
            const target = new Date(date);
            target.setHours(0, 0, 0, 0);
            
            for (let i = JIEQI_DATA.length - 1; i >= 0; i--) {
                const jqDate = new Date(JIEQI_DATA[i].date);
                if (target >= jqDate) {
                    return JIEQI_DATA[i];
                }
            }
            return JIEQI_DATA[0];
        }
        
        // 定局数
        function determineJuShu(jieQi, dayGanZhi) {
            const xunShou = XUNSHOU_MAP[dayGanZhi];
            const fuTouZhi = DIZHI.indexOf(xunShou[1]);
            
            let yuan;
            if ([0, 6, 3, 9].includes(fuTouZhi)) {
                yuan = 0;
            } else if ([2, 8, 5, 11].includes(fuTouZhi)) {
                yuan = 1;
            } else {
                yuan = 2;
            }
            
            const juShu = SAN_YUAN[jieQi.name][yuan];
            const isYang = jieQi.type === 'yang';
            
            return {
                ju: juShu,
                isYang,
                yuan: ['上元', '中元', '下元'][yuan],
                type: isYang ? '阳遁' : '阴遁'
            };
        }
        
        // 排地盘干
        function paiDiPan(juShu, isYang) {
            const diPan = {};
            const tianGanOrder = [4, 5, 6, 7, 8, 9, 3, 2, 1]; // 戊(4)己(5)庚(6)辛(7)壬(8)癸(9)丁(3)丙(2)乙(1)
            let gongOrder = isYang ? [1, 2, 3, 4, 5, 6, 7, 8, 9] : [9, 8, 7, 6, 5, 4, 3, 2, 1];
            const startIndex = gongOrder.indexOf(juShu);
            
            for (let i = 0; i < 9; i++) {
                const gong = gongOrder[(startIndex + i) % 9];
                const ganIndex = tianGanOrder[i];
                diPan[gong] = TIANGAN[ganIndex];
            }
            return diPan;
        }
        
        // 旬首到六仪的映射
        const XUNSHOU_LIUYI = {
            '甲子': '戊', '甲戌': '己', '甲申': '庚', 
            '甲午': '辛', '甲辰': '壬', '甲寅': '癸'
        };
        
        // 找值符值使（修正版）
        function findZhiFuZhiShi(hourGanZhi, diPan) {
            const xunShou = XUNSHOU_MAP[hourGanZhi];
            const liuYi = XUNSHOU_LIUYI[xunShou]; // 六仪：戊己庚辛壬癸
            
            // 找六仪在地盘的宫位
            let xunShouGong = null;
            for (let gong in diPan) {
                if (diPan[gong] === liuYi) {
                    xunShouGong = parseInt(gong);
                    break;
                }
            }
            
            return {
                xunShou: xunShou + liuYi, // 如：甲辰壬
                xunShouGong,
                zhiFuXing: JIU_XING[xunShouGong],
                zhiShiMen: BA_MEN[xunShouGong]
            };
        }
        
        // 排天盘干和九星（修正版）
        function paiTianPan(hourGanZhi, diPan, zhiFuInfo, isYang) {
            const tianPan = {};
            const hourGan = hourGanZhi[0];
            
            // 找时干在地盘的宫位（值符星要飞到这里）
            let hourGanGong = null;
            for (let gongStr in diPan) {
                const gongNum = parseInt(gongStr);
                if (diPan[gongStr] === hourGan) {
                    hourGanGong = gongNum;
                    break;
                }
            }
            
            const starOrder = ['天蓬', '天任', '天冲', '天辅', '天英', '天芮', '天柱', '天心'];
            const zhiFuIndex = starOrder.indexOf(zhiFuInfo.zhiFuXing);
            let currentGongIndex = CLOCKWISE_ORDER.indexOf(hourGanGong);
            
            // 值符星到时干宫，带旬首的六仪
            const liuYi = zhiFuInfo.xunShou.slice(2);
            tianPan[hourGanGong] = {
                star: zhiFuInfo.zhiFuXing,
                gan: liuYi
            };
            
            // 其他星按顺序排，带原始宫的地盘干
            for (let i = 1; i < 8; i++) {
                currentGongIndex = (currentGongIndex + 1) % 8;
                const gong = CLOCKWISE_ORDER[currentGongIndex];
                
                // 跳过已经设置的值符宫
                if (gong === hourGanGong) continue;
                
                const starIndex = (zhiFuIndex + i) % 8;
                const star = starOrder[starIndex];
                const origGong = Object.keys(JIU_XING).find(k => JIU_XING[k] === star);
                tianPan[gong] = {
                    star,
                    gan: diPan[origGong]
                };
            }
            
            tianPan[5] = {
                star: '天禽',
                gan: diPan[5] || '乙'
            };
            
            return {tianPan, hourGanGong};
        }
        
        // 排八神
        function paiBaShen(zhiFuGong, isYang) {
            const baShen = {};
            const shenOrder = isYang ? BA_SHEN_YANG : BA_SHEN_YIN;
            const zhiFuIndex = CLOCKWISE_ORDER.indexOf(zhiFuGong);
            
            for (let i = 0; i < 8; i++) {
                const gongIndex = (zhiFuIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                baShen[gong] = shenOrder[i];
            }
            
            return baShen;
        }
        
        // 排八门
        function paiBaMen(zhiFuInfo, hourZhi, isYang) {
            const baMen = {};
            const menOrder = ['休门', '生门', '伤门', '杜门', '景门', '死门', '惊门', '开门'];
            const zhiShiIndex = menOrder.indexOf(zhiFuInfo.zhiShiMen);
            
            // 计算值使门落宫：从旬首宫开始，数时辰地支
            const xunShouZhi = XUNSHOU_DIZHI[zhiFuInfo.xunShou.slice(0, 2)]; // 取"甲辰壬"中的"甲辰"
            let steps;
            if (isYang) {
                steps = (hourZhi - xunShouZhi + 12) % 12;
            } else {
                steps = (xunShouZhi - hourZhi + 12) % 12;
            }
            
            console.log('paiBaMen调试:', {
                xunShou: zhiFuInfo.xunShou,
                xunShouZhi,
                hourZhi,
                steps,
                xunShouGong: zhiFuInfo.xunShouGong
            });
            
            // 从旬首宫开始走
            let currentGong = zhiFuInfo.xunShouGong;
            
            // 每1步走一宫（不是2步！）
            for (let i = 0; i < steps; i++) {
                const idx = CLOCKWISE_ORDER.indexOf(currentGong);
                currentGong = CLOCKWISE_ORDER[(idx + (isYang ? 1 : -1) + 8) % 8];
                console.log(`第${i+1}步到:`, currentGong);
            }
            
            console.log('最终值使门落宫:', currentGong);
            
            const startIndex = CLOCKWISE_ORDER.indexOf(currentGong);
            
            console.log('八门排布:');
            for (let i = 0; i < 8; i++) {
                const gongIndex = (startIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                const menIdx = (zhiShiIndex + i) % 8;
                baMen[gong] = menOrder[menIdx];
                console.log(`  宫${gong}: ${menOrder[menIdx]}`);
            }
            
            return {baMen, zhiShiGong: currentGong};
        }
        
        // 排隐干
        function paiYinGan(zhiShiGong, diPan, hourGanZhi, isYang) {
            const yinGan = {};
            const ganOrder = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
            const hourGan = hourGanZhi[0];
            const hourGanIndex = ganOrder.indexOf(hourGan);
            
            const gongOrder = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            const startIndex = gongOrder.indexOf(zhiShiGong);
            
            for (let i = 0; i < 9; i++) {
                const ganIdx = (hourGanIndex + i) % 9;
                const gongIdx = (startIndex + i) % 9;
                const gong = gongOrder[gongIdx];
                yinGan[gong] = ganOrder[ganIdx];
            }
            
            return yinGan;
        }
        
        // 检测四害
        function checkSiHai(gong, diPanGan, tianPanGan, men, star, yinGan) {
            const sihai = [];
            
            // 门迫
            if (men && MENKE[men] && MENKE[men].includes(gong)) {
                sihai.push('门迫');
            }
            
            // 击刑
            if (tianPanGan && JIXING[tianPanGan] === gong) {
                sihai.push('击刑');
            }
            
            // 入墓
            if (tianPanGan && RUMU[tianPanGan] === gong) {
                sihai.push('入墓');
            }
            
            // 伏吟（天盘干=地盘干）
            if (tianPanGan && diPanGan && tianPanGan === diPanGan) {
                sihai.push('伏吟');
            }
            
            return sihai;
        }
        
        // 检测格局
        function checkGeJu(tianPanGan, diPanGan) {
            if (!tianPanGan || !diPanGan) return null;
            const key = tianPanGan + diPanGan;
            return JIGE[key] || null;
        }
        
        // 主排盘函数
        function qiPan() {
            const date = new Date(document.getElementById('date').value);
            const hour = parseInt(document.getElementById('hour').value);
            
            // 先获取节气（用于月柱计算）
            const jieQi = getJieQi(date);
            
            // 四柱
            const yearGZ = getYearGanZhi(date.getFullYear());
            const monthGZ = getMonthGanZhi(yearGZ.gan, jieQi.name);
            const dayGZ = getDayGanZhi(date);
            const hourGZ = getHourGanZhi(dayGZ.gan, hour);
            
            // 显示四柱
            const sizhuRow = document.getElementById('sizhuRow');
            sizhuRow.innerHTML = `
                <div class="sizhu-item"><div class="label">年柱</div><div class="value">${yearGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">月柱</div><div class="value">${monthGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">日柱</div><div class="value">${dayGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">时柱</div><div class="value">${hourGZ.ganZhi}</div></div>
            `;
            
            // 定局
            const juInfo = determineJuShu(jieQi, dayGZ.ganZhi);
            
            // 排地盘
            const diPan = paiDiPan(juInfo.ju, juInfo.isYang);
            
            // 找值符值使
            const zhiFuInfo = findZhiFuZhiShi(hourGZ.ganZhi, diPan);
            
            // 排天盘
            console.log('排天盘前diPan:', JSON.stringify(diPan));
            const {tianPan, hourGanGong} = paiTianPan(hourGZ.ganZhi, diPan, zhiFuInfo, juInfo.isYang);
            console.log('排天盘后diPan:', JSON.stringify(diPan));
            
            // 排八神
            const baShen = paiBaShen(hourGanGong, juInfo.isYang);
            
            // 排八门
            const {baMen, zhiShiGong} = paiBaMen(zhiFuInfo, hour, juInfo.isYang);
            
            // 排隐干
            const yinGan = paiYinGan(zhiShiGong, diPan, hourGZ.ganZhi, juInfo.isYang);
            
            // 马星
            const maXingZhi = MAXING[hour];
            const maXingGong = Object.keys(diPan).find(k => DIZHI.indexOf(diPan[k]) === maXingZhi);
            
            // 保存数据
            currentPanData = {
                sizhu: {year: yearGZ, month: monthGZ, day: dayGZ, hour: hourGZ},
                jieQi,
                juInfo,
                zhiFuInfo,
                diPan,
                tianPan,
                baShen,
                baMen,
                yinGan,
                maXing: DIZHI[maXingZhi],
                isYang: juInfo.isYang
            };
            
            // 显示信息
            document.getElementById('jieqi').textContent = jieQi.name;
            document.getElementById('jushu').textContent = `${juInfo.type}${juInfo.ju}局 (${juInfo.yuan})`;
            document.getElementById('xunshou').textContent = zhiFuInfo.xunShou;
            document.getElementById('zhifu').textContent = zhiFuInfo.zhiFuXing;
            document.getElementById('zhishi').textContent = zhiFuInfo.zhiShiMen;
            document.getElementById('maxing').textContent = DIZHI[maXingZhi];
            
            // 显示四害
            const sihaiGrid = document.getElementById('sihaiGrid');
            sihaiGrid.innerHTML = `
                <div class="sihai-item"><strong>门迫</strong><br>门克宫</div>
                <div class="sihai-item"><strong>击刑</strong><br>地支刑</div>
                <div class="sihai-item"><strong>入墓</strong><br>天干墓</div>
                <div class="sihai-item"><strong>伏吟</strong><br>天地同</div>
            `;
            
            document.getElementById('infoSection').classList.add('active');
            
            // 渲染九宫
            renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo);
            
            document.getElementById('panSection').classList.add('active');
        }
        
        // 渲染盘面
        function renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo) {
            const container = document.getElementById('panContainer');
            container.innerHTML = '';
            
            const gongPositions = [4, 9, 2, 3, 5, 7, 8, 1, 6];
            
            gongPositions.forEach(gongNum => {
                const gong = document.createElement('div');
                gong.className = 'gong' + (gongNum === 5 ? ' zhong' : '');
                
                const tp = tianPan[gongNum] || {};
                const star = tp.star || '';
                const tpGan = tp.gan || '';
                const dpGan = diPan[gongNum] || '';
                const shen = baShen[gongNum] || '';
                const men = baMen[gongNum] || '';
                const yg = yinGan[gongNum] || '';
                
                // 检测四害
                const sihai = checkSiHai(gongNum, dpGan, tpGan, men, star, yg);
                const geju = checkGeJu(tpGan, dpGan);
                
                if (sihai.includes('门迫')) gong.classList.add('menpo');
                if (sihai.includes('击刑') || sihai.includes('入墓')) gong.classList.add('jixing');
                if (star === zhiFuInfo.zhiFuXing) gong.classList.add('zhifu');
                
                // 新布局：
                // 第一行：八神
                // 第二行：隐干 | 九星 | 天盘干
                // 第三行：八门 | 地盘干
                
                // 调试：打印关键宫位的值
                if (gongNum === 8 || gongNum === 1) {
                    console.log('宫位' + gongNum + '调试:', {
                        star, tpGan, dpGan, shen, men, yg,
                        tianPanObj: tianPan[gongNum]
                    });
                }
                
                gong.innerHTML = `
                    <div class="row1">${shen}</div>
                    <div class="row2">
                        <span class="yg-left">${yg}</span>
                        <span class="star-center">${star}</span>
                        <span class="tp-right">${tpGan}${sihai.includes('击刑') ? '刑' : ''}${sihai.includes('入墓') ? '墓' : ''}</span>
                    </div>
                    <div class="row3">
                        <span class="men-left ${sihai.includes('门迫') ? 'menpo' : ''}">${men}${sihai.includes('门迫') ? '迫' : ''}</span>
                        <span class="dp-right">${dpGan}</span>
                    </div>
                    ${geju ? `<div class="geju-new">${geju}</div>` : ''}
                `;
                
                container.appendChild(gong);
            });
        }
        
        // 导出盘面
        function exportPan() {
            if (!currentPanData) {
                alert('请先起盘！');
                return;
            }
            
            const data = currentPanData;
            let output = `=== 奇门遁甲排盘 ===\n`;
            output += `日期: ${new Date().toLocaleString()}\n\n`;
            output += `【四柱】\n`;
            output += `年柱: ${data.sizhu.year.ganZhi}\n`;
            output += `月柱: ${data.sizhu.month.ganZhi}\n`;
            output += `日柱: ${data.sizhu.day.ganZhi}\n`;
            output += `时柱: ${data.sizhu.hour.ganZhi}\n\n`;
            output += `【局信息】\n`;
            output += `节气: ${data.jieQi.name}\n`;
            output += `局数: ${data.juInfo.type}${data.juInfo.ju}局 (${data.juInfo.yuan})\n`;
            output += `旬首: ${data.zhiFuInfo.xunShou}\n`;
            output += `值符: ${data.zhiFuInfo.zhiFuXing}\n`;
            output += `值使: ${data.zhiFuInfo.zhiShiMen}\n`;
            output += `马星: ${data.maXing}\n\n`;
            
            console.log(output);
            
            // 创建下载
            const blob = new Blob([output], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `奇门排盘_${data.sizhu.day.ganZhi}_${data.sizhu.hour.ganZhi}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
