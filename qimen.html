<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇门遁甲排盘工具 - V2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .input-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .input-group input, .input-group select {
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            min-width: 120px;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #ffd700;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .info-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
        }
        
        .info-section.active {
            display: block;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .info-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid #ffd700;
            text-align: center;
        }
        
        .info-card h3 {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        
        .info-card p {
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: bold;
        }
        
        .pan-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            display: none;
        }
        
        .pan-section.active {
            display: block;
        }
        
        .pan-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .gong {
            aspect-ratio: 1;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(0,0,0,0.2));
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-size: 0.85rem;
        }
        
        .gong:hover {
            border-color: #ffd700;
            transform: scale(1.02);
        }
        
        .gong.zhong {
            grid-column: 2;
            grid-row: 2;
            background: linear-gradient(145deg, rgba(255,215,0,0.15), rgba(0,0,0,0.3));
            border-color: rgba(255, 215, 0, 0.4);
        }
        
        .gong.zhifu {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }
        
        .gong .gong-name {
            font-size: 0.7rem;
            color: #888;
            text-align: center;
        }
        
        .gong .star {
            font-size: 0.9rem;
            color: #4ecdc4;
            text-align: center;
            font-weight: bold;
        }
        
        .gong .god {
            font-size: 0.8rem;
            color: #ff6b6b;
            text-align: center;
        }
        
        .gong .door {
            font-size: 1rem;
            color: #ffd700;
            text-align: center;
            font-weight: bold;
        }
        
        .gong .tiangan-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        
        .gong .dp {
            color: #95e1d3;
        }
        
        .gong .tp {
            color: #f38181;
        }
        
        .gong .yg {
            font-size: 0.75rem;
            color: #aa96da;
            text-align: center;
        }
        
        .legend {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        
        .sizhu-section {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .sizhu-section h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .sizhu-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .sizhu-item {
            text-align: center;
        }
        
        .sizhu-item .label {
            font-size: 0.8rem;
            color: #888;
        }
        
        .sizhu-item .value {
            font-size: 1.3rem;
            color: #ffd700;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .pan-container {
                gap: 5px;
            }
            
            .gong {
                padding: 5px;
                font-size: 0.75rem;
            }
            
            .gong .door {
                font-size: 0.85rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☯ 奇门遁甲排盘工具</h1>
        <p class="subtitle">V2.0 | 拆补法 · 寄坤宫 · 完整排盘</p>
        
        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label>公历日期</label>
                    <input type="date" id="date" value="2026-04-03">
                </div>
                <div class="input-group">
                    <label>时辰</label>
                    <select id="hour">
                        <option value="0">子时 (23-1)</option>
                        <option value="1">丑时 (1-3)</option>
                        <option value="2">寅时 (3-5)</option>
                        <option value="3">卯时 (5-7)</option>
                        <option value="4">辰时 (7-9)</option>
                        <option value="5">巳时 (9-11)</option>
                        <option value="6" selected>午时 (11-13)</option>
                        <option value="7">未时 (13-15)</option>
                        <option value="8">申时 (15-17)</option>
                        <option value="9">酉时 (17-19)</option>
                        <option value="10">戌时 (19-21)</option>
                        <option value="11">亥时 (21-23)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>分钟</label>
                    <input type="number" id="minute" min="0" max="59" value="30">
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn-primary" onclick="qiPan()">起盘</button>
                <button class="btn-secondary" onclick="useNow()">使用当前时间</button>
            </div>
        </div>
        
        <div class="info-section" id="infoSection">
            <div class="sizhu-section">
                <h3>四柱八字</h3>
                <div class="sizhu-row" id="sizhuRow">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="info-grid">
                <div class="info-card">
                    <h3>节气</h3>
                    <p id="jieqi">-</p>
                </div>
                <div class="info-card">
                    <h3>局数</h3>
                    <p id="jushu">-</p>
                </div>
                <div class="info-card">
                    <h3>旬首</h3>
                    <p id="xunshou">-</p>
                </div>
                <div class="info-card">
                    <h3>值符</h3>
                    <p id="zhifu">-</p>
                </div>
                <div class="info-card">
                    <h3>值使</h3>
                    <p id="zhishi">-</p>
                </div>
            </div>
        </div>
        
        <div class="pan-section" id="panSection">
            <div class="pan-container" id="panContainer">
                <!-- 九宫格将由JavaScript生成 -->
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    <span>九星</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b6b;"></div>
                    <span>八神</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffd700;"></div>
                    <span>八门</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #95e1d3;"></div>
                    <span>地盘干</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f38181;"></div>
                    <span>天盘干</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #aa96da;"></div>
                    <span>隐干</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 基础数据
        const TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        
        // 六十甲子
        const JIAZI = [];
        for (let i = 0; i < 60; i++) {
            JIAZI.push(TIANGAN[i % 10] + DIZHI[i % 12]);
        }
        
        // 六甲旬首
        const XUNSHOU_MAP = {};
        const XUNSHOU_LIST = ['甲子', '甲戌', '甲申', '甲午', 'A辰', '甲寅'];
        for (let i = 0; i < 60; i++) {
            const xunIndex = Math.floor(i / 10);
            XUNSHOU_MAP[JIAZI[i]] = XUNSHOU_LIST[xunIndex];
        }
        
        // 节气数据（2024-2027）
        const JIEQI_DATA = [
            {name: '冬至', date: '2024-12-21', type: 'yang'},
            {name: '小寒', date: '2025-01-05', type: 'yang'},
            {name: '大寒', date: '2025-01-20', type: 'yang'},
            {name: '立春', date: '2025-02-03', type: 'yang'},
            {name: '雨水', date: '2025-02-18', type: 'yang'},
            {name: '惊蛰', date: '2025-03-05', type: 'yang'},
            {name: '春分', date: '2025-03-20', type: 'yang'},
            {name: '清明', date: '2025-04-04', type: 'yang'},
            {name: '谷雨', date: '2025-04-20', type: 'yang'},
            {name: '立夏', date: '2025-05-05', type: 'yang'},
            {name: '小满', date: '2025-05-21', type: 'yang'},
            {name: '芒种', date: '2025-06-05', type: 'yang'},
            {name: '夏至', date: '2025-06-21', type: 'yin'},
            {name: '小暑', date: '2025-07-07', type: 'yin'},
            {name: '大暑', date: '2025-07-22', type: 'yin'},
            {name: '立秋', date: '2025-08-07', type: 'yin'},
            {name: '处暑', date: '2025-08-23', type: 'yin'},
            {name: '白露', date: '2025-09-07', type: 'yin'},
            {name: '秋分', date: '2025-09-23', type: 'yin'},
            {name: '寒露', date: '2025-10-08', type: 'yin'},
            {name: '霜降', date: '2025-10-23', type: 'yin'},
            {name: '立冬', date: '2025-11-07', type: 'yin'},
            {name: '小雪', date: '2025-11-22', type: 'yin'},
            {name: '大雪', date: '2025-12-07', type: 'yin'},
            {name: '冬至', date: '2025-12-21', type: 'yang'},
            {name: '小寒', date: '2026-01-05', type: 'yang'},
            {name: '大寒', date: '2026-01-20', type: 'yang'},
            {name: '立春', date: '2026-02-04', type: 'yang'},
            {name: '雨水', date: '2026-02-18', type: 'yang'},
            {name: '惊蛰', date: '2026-03-05', type: 'yang'},
            {name: '春分', date: '2026-03-20', type: 'yang'},
            {name: '清明', date: '2026-04-05', type: 'yang'},
            {name: '谷雨', date: '2026-04-20', type: 'yang'},
            {name: '立夏', date: '2026-05-05', type: 'yang'},
            {name: '小满', date: '2026-05-21', type: 'yang'},
            {name: '芒种', date: '2026-06-05', type: 'yang'},
            {name: '夏至', date: '2026-06-21', type: 'yin'},
            {name: '小暑', date: '2026-07-07', type: 'yin'},
            {name: '大暑', date: '2026-07-23', type: 'yin'},
            {name: '立秋', date: '2026-08-07', type: 'yin'},
            {name: '处暑', date: '2026-08-23', type: 'yin'},
            {name: '白露', date: '2026-09-07', type: 'yin'},
            {name: '秋分', date: '2026-09-23', type: 'yin'},
            {name: '寒露', date: '2026-10-08', type: 'yin'},
            {name: '霜降', date: '2026-10-23', type: 'yin'},
            {name: '立冬', date: '2026-11-07', type: 'yin'},
            {name: '小雪', date: '2026-11-22', type: 'yin'},
            {name: '大雪', date: '2026-12-07', type: 'yin'}
        ];
        
        // 三元定局表
        const SAN_YUAN = {
            '冬至': [1, 7, 4], '小寒': [2, 8, 5], '大寒': [3, 9, 6],
            '立春': [8, 5, 2], '雨水': [9, 6, 3], '惊蛰': [1, 7, 4],
            '春分': [3, 9, 6], '清明': [4, 1, 7], '谷雨': [5, 2, 8],
            '立夏': [4, 1, 7], '小满': [5, 2, 8], '芒种': [6, 3, 9],
            '夏至': [9, 3, 6], '小暑': [8, 2, 5], '大暑': [7, 1, 4],
            '立秋': [2, 5, 8], '处暑': [1, 4, 7], '白露': [9, 3, 6],
            '秋分': [7, 1, 4], '寒露': [6, 9, 3], '霜降': [5, 8, 2],
            '立冬': [6, 9, 3], '小雪': [5, 8, 2], '大雪': [4, 7, 1]
        };
        
        // 九星
        const JIU_XING = {
            1: '天蓬', 8: '天任', 3: '天冲', 4: '天辅',
            9: '天英', 2: '天芮', 7: '天柱', 6: '天心', 5: '天禽'
        };
        
        // 八门
        const BA_MEN = {
            1: '休门', 8: '生门', 3: '伤门', 4: '杜门',
            9: '景门', 2: '死门', 7: '惊门', 6: '开门'
        };
        
        // 八神（阳遁顺序）
        const BA_SHEN_YANG = ['值符', '螣蛇', '太阴', '六合', '白虎', '玄武', '九地', '九天'];
        const BA_SHEN_YIN = ['值符', '九天', '九地', '玄武', '白虎', '六合', '太阴', '螣蛇'];
        
        // 宫位名称
        const GONG_NAMES = {
            1: '坎一', 2: '坤二', 3: '震三', 4: '巽四',
            5: '中五', 6: '乾六', 7: '兑七', 8: '艮八', 9: '离九'
        };
        
        // 物理顺时针顺序（从坎一开始）
        const CLOCKWISE_ORDER = [1, 8, 3, 4, 9, 2, 7, 6];
        
        // 数字顺序（隐干用）
        const NUMBER_ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        
        // 获取当前时间
        function useNow() {
            const now = new Date();
            document.getElementById('date').value = now.toISOString().split('T')[0];
            document.getElementById('hour').value = Math.floor((now.getHours() + 1) / 2) % 12;
            document.getElementById('minute').value = now.getMinutes();
        }
        
        // 计算年干支
        function getYearGanZhi(year) {
            const gan = (year - 4) % 10;
            const zhi = (year - 4) % 12;
            return {
                gan: gan,
                zhi: zhi,
                ganZhi: TIANGAN[gan] + DIZHI[zhi]
            };
        }
        
        // 计算日干支（简化算法）
        function getDayGanZhi(date) {
            // 以1900年1月31日为基准（甲辰日）
            const baseDate = new Date(1900, 0, 31);
            const diffTime = date.getTime() - baseDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const index = (40 + diffDays) % 60; // 甲辰是第40个
            return {
                gan: index % 10,
                zhi: index % 12,
                ganZhi: JIAZI[index]
            };
        }
        
        // 计算时辰干支
        function getHourGanZhi(dayGan, hourZhi) {
            // 日上起时法
            const startGan = [0, 0, 2, 2, 4, 4, 6, 6, 8, 8][dayGan];
            const gan = (startGan + hourZhi) % 10;
            return {
                gan: gan,
                zhi: hourZhi,
                ganZhi: TIANGAN[gan] + DIZHI[hourZhi]
            };
        }
        
        // 计算月干支
        function getMonthGanZhi(yearGan, month) {
            // 年上起月法
            const startGan = [2, 4, 6, 8, 0, 2, 4, 6, 8, 0][yearGan]; // 甲己年起丙寅
            const gan = (startGan + month - 1) % 10;
            const zhi = (month + 1) % 12; // 寅月为2
            return {
                gan: gan,
                zhi: zhi,
                ganZhi: TIANGAN[gan] + DIZHI[zhi]
            };
        }
        
        // 获取节气
        function getJieQi(date) {
            const target = new Date(date);
            target.setHours(0, 0, 0, 0);
            
            for (let i = JIEQI_DATA.length - 1; i >= 0; i--) {
                const jqDate = new Date(JIEQI_DATA[i].date);
                if (target >= jqDate) {
                    return JIEQI_DATA[i];
                }
            }
            return JIEQI_DATA[0];
        }
        
        // 定局数
        function determineJuShu(jieQi, dayGanZhi) {
            const xunShou = XUNSHOU_MAP[dayGanZhi];
            const fuTouZhi = DIZHI.indexOf(xunShou[1]);
            
            let yuan;
            if ([0, 6, 3, 9].includes(fuTouZhi)) {
                yuan = 0;
            } else if ([2, 8, 5, 11].includes(fuTouZhi)) {
                yuan = 1;
            } else {
                yuan = 2;
            }
            
            const juShu = SAN_YUAN[jieQi.name][yuan];
            const isYang = jieQi.type === 'yang';
            
            return {
                ju: juShu,
                isYang: isYang,
                yuan: ['上元', '中元', '下元'][yuan],
                type: isYang ? '阳遁' : '阴遁'
            };
        }
        
        // 排地盘干
        function paiDiPan(juShu, isYang) {
            const diPan = {};
            const tianGanOrder = [4, 5, 6, 7, 8, 9, 0, 1, 2, 3]; // 戊己庚辛壬癸丁丙乙
            
            let gongOrder = isYang ? [1, 2, 3, 4, 5, 6, 7, 8, 9] : [9, 8, 7, 6, 5, 4, 3, 2, 1];
            const startIndex = gongOrder.indexOf(juShu);
            
            for (let i = 0; i < 9; i++) {
                const gong = gongOrder[(startIndex + i) % 9];
                const ganIndex = tianGanOrder[i];
                diPan[gong] = TIANGAN[ganIndex];
            }
            
            return diPan;
        }
        
        // 找值符值使
        function findZhiFuZhiShi(hourGanZhi, diPan) {
            const xunShou = XUNSHOU_MAP[hourGanZhi];
            const xunShouGanIndex = TIANGAN.indexOf(xunShou[0]);
            
            let xunShouGong = null;
            for (let gong in diPan) {
                if (diPan[gong] === TIANGAN[xunShouGanIndex]) {
                    xunShouGong = parseInt(gong);
                    break;
                }
            }
            
            const zhiFuXing = JIU_XING[xunShouGong];
            const zhiShiMen = BA_MEN[xunShouGong];
            
            return {
                xunShou: xunShou,
                xunShouGong: xunShouGong,
                zhiFuXing: zhiFuXing,
                zhiShiMen: zhiShiMen
            };
        }
        
        // 排天盘干
        function paiTianPan(hourGanZhi, diPan, zhiFuInfo, isYang) {
            const tianPan = {};
            const hourGan = hourGanZhi[0];
            
            // 找时干在地盘的宫位
            let hourGanGong = null;
            for (let gong in diPan) {
                if (diPan[gong] === hourGan) {
                    hourGanGong = parseInt(gong);
                    break;
                }
            }
            
            // 值符到时干宫
            tianPan[hourGanGong] = {
                star: zhiFuInfo.zhiFuXing,
                gan: zhiFuInfo.xunShou[0] // 旬首干
            };
            
            // 其他星按顺序排
            const starOrder = ['天蓬', '天任', '天冲', '天辅', '天英', '天芮', '天柱', '天心'];
            const zhiFuIndex = starOrder.indexOf(zhiFuInfo.zhiFuXing);
            
            // 物理顺时针方向
            let currentGongIndex = CLOCKWISE_ORDER.indexOf(hourGanGong);
            
            for (let i = 1; i < 8; i++) {
                currentGongIndex = (currentGongIndex + 1) % 8;
                const gong = CLOCKWISE_ORDER[currentGongIndex];
                if (gong === 5) continue; // 跳过中五
                
                const starIndex = (zhiFuIndex + i) % 8;
                const star = starOrder[starIndex];
                const origGong = Object.keys(JIU_XING).find(k => JIU_XING[k] === star);
                
                tianPan[gong] = {
                    star: star,
                    gan: diPan[origGong]
                };
            }
            
            // 中五宫
            tianPan[5] = {
                star: '天禽',
                gan: diPan[5] || '戊'
            };
            
            return tianPan;
        }
        
        // 排八神
        function paiBaShen(zhiFuGong, isYang) {
            const baShen = {};
            const shenOrder = isYang ? BA_SHEN_YANG : BA_SHEN_YIN;
            
            const zhiFuIndex = CLOCKWISE_ORDER.indexOf(zhiFuGong);
            
            for (let i = 0; i < 8; i++) {
                const gongIndex = (zhiFuIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                baShen[gong] = shenOrder[i];
            }
            
            return baShen;
        }
        
        // 排八门
        function paiBaMen(zhiShiMen, xunShouGong, hourZhi, isYang) {
            const baMen = {};
            const menOrder = ['休门', '生门', '伤门', '杜门', '景门', '死门', '惊门', '开门'];
            const zhiShiIndex = menOrder.indexOf(zhiShiMen);
            
            // 计算值使门落宫
            const xunShouZhi = DIZHI.indexOf(XUNSHOU_MAP[TIANGAN[0] + DIZHI[hourZhi]][1]);
            const hourZhiIndex = hourZhi;
            
            let steps;
            if (isYang) {
                steps = (hourZhiIndex - xunShouZhi + 12) % 12;
            } else {
                steps = (xunShouZhi - hourZhiIndex + 12) % 12;
            }
            
            // 简化：值使门从旬首宫开始走
            let currentGong = xunShouGong;
            for (let i = 0; i < steps; i++) {
                const idx = CLOCKWISE_ORDER.indexOf(currentGong);
                currentGong = CLOCKWISE_ORDER[(idx + (isYang ? 1 : -1) + 8) % 8];
            }
            
            // 从值使门落宫开始排八门
            const startIndex = CLOCKWISE_ORDER.indexOf(currentGong);
            
            for (let i = 0; i < 8; i++) {
                const gongIndex = (startIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                const menIndex = (zhiShiIndex + i) % 8;
                baMen[gong] = menOrder[menIndex];
            }
            
            return baMen;
        }
        
        // 排隐干
        function paiYinGan(zhiShiMenGong, diPan, hourGanZhi, isYang) {
            const yinGan = {};
            const ganOrder = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
            const hourGan = hourGanZhi[0];
            
            // 找时干序号
            const hourGanIndex = ganOrder.indexOf(hourGan);
            
            // 从值使门落宫开始
            const startGong = zhiShiMenGong;
            const startIndex = NUMBER_ORDER.indexOf(startGong);
            
            for (let i = 0; i < 9; i++) {
                const ganIdx = (hourGanIndex + i) % 9;
                const gongIdx = (startIndex + i) % 9;
                const gong = NUMBER_ORDER[gongIdx];
                yinGan[gong] = ganOrder[ganIdx];
            }
            
            return yinGan;
        }
        
        // 主排盘函数
        function qiPan() {
            const date = new Date(document.getElementById('date').value);
            const hour = parseInt(document.getElementById('hour').value);
            
            // 计算四柱
            const yearGZ = getYearGanZhi(date.getFullYear());
            const monthGZ = getMonthGanZhi(yearGZ.gan, date.getMonth() + 1);
            const dayGZ = getDayGanZhi(date);
            const hourGZ = getHourGanZhi(dayGZ.gan, hour);
            
            // 显示四柱
            const sizhuRow = document.getElementById('sizhuRow');
            sizhuRow.innerHTML = `
                <div class="sizhu-item">
                    <div class="label">年柱</div>
                    <div class="value">${yearGZ.ganZhi}</div>
                </div>
                <div class="sizhu-item">
                    <div class="label">月柱</div>
                    <div class="value">${monthGZ.ganZhi}</div>
                </div>
                <div class="sizhu-item">
                    <div class="label">日柱</div>
                    <div class="value">${dayGZ.ganZhi}</div>
                </div>
                <div class="sizhu-item">
                    <div class="label">时柱</div>
                    <div class="value">${hourGZ.ganZhi}</div>
                </div>
            `;
            
            // 获取节气
            const jieQi = getJieQi(date);
            
            // 定局
            const juInfo = determineJuShu(jieQi, dayGZ.ganZhi);
            
            // 排地盘
            const diPan = paiDiPan(juInfo.ju, juInfo.isYang);
            
            // 找值符值使
            const zhiFuInfo = findZhiFuZhiShi(hourGZ.ganZhi, diPan);
            
            // 排天盘
            const tianPan = paiTianPan(hourGZ.ganZhi, diPan, zhiFuInfo, juInfo.isYang);
            
            // 排八神
            const hourGanGong = Object.keys(diPan).find(k => diPan[k] === hourGZ.ganZhi[0]);
            const baShen = paiBaShen(parseInt(hourGanGong), juInfo.isYang);
            
            // 排八门（简化版）
            const baMen = {};
            const menOrder = ['休门', '生门', '伤门', '杜门', '景门', '死门', '惊门', '开门'];
            
            // 值使门落宫简化处理
            let zhiShiGong = zhiFuInfo.xunShouGong;
            const zhiShiIndex = menOrder.indexOf(zhiFuInfo.zhiShiMen);
            
            for (let i = 0; i < 8; i++) {
                const gong = CLOCKWISE_ORDER[i];
                const menIdx = (zhiShiIndex + i) % 8;
                baMen[gong] = menOrder[menIdx];
            }
            
            // 排隐干
            const yinGan = paiYinGan(zhiShiGong, diPan, hourGZ.ganZhi, juInfo.isYang);
            
            // 显示信息
            document.getElementById('jieqi').textContent = jieQi.name;
            document.getElementById('jushu').textContent = `${juInfo.type}${juInfo.ju}局 (${juInfo.yuan})`;
            document.getElementById('xunshou').textContent = zhiFuInfo.xunShou;
            document.getElementById('zhifu').textContent = zhiFuInfo.zhiFuXing;
            document.getElementById('zhishi').textContent = zhiFuInfo.zhiShiMen;
            
            document.getElementById('infoSection').classList.add('active');
            
            // 渲染九宫格
            renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo);
            
            document.getElementById('panSection').classList.add('active');
        }
        
        // 渲染盘面
        function renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo) {
            const container = document.getElementById('panContainer');
            container.innerHTML = '';
            
            // 九宫位置映射
            const gongPositions = [4, 9, 2, 3, 5, 7, 8, 1, 6];
            
            gongPositions.forEach(gongNum => {
                const gong = document.createElement('div');
                gong.className = 'gong' + (gongNum === 5 ? ' zhong' : '');
                
                if (tianPan[gongNum] && tianPan[gongNum].star === zhiFuInfo.zhiFuXing) {
                    gong.classList.add('zhifu');
                }
                
                const star = tianPan[gongNum] ? tianPan[gongNum].star : '-';
                const tpGan = tianPan[gongNum] ? tianPan[gongNum].gan : '-';
                const dpGan = diPan[gongNum] || '-';
                const shen = baShen[gongNum] || '-';
                const men = baMen[gongNum] || '-';
                const yg = yinGan[gongNum] || '-';
                
                gong.innerHTML = `
                    <div class="gong-name">${GONG_NAMES[gongNum]}</div>
                    <div class="star">${star}</div>
                    <div class="god">${shen}</div>
                    <div class="door">${men}</div>
                    <div class="tiangan-row">
                        <span class="dp">地:${dpGan}</span>
                        <span class="tp">天:${tpGan}</span>
                    </div>
                    <div class="yg">隐:${yg}</div>
                `;
                
                container.appendChild(gong);
            });
        }
    </script>
