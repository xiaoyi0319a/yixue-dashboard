<body>

    <script>
        // 基础数据
        const TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        
        // 六十甲子
        const JIAZI = [];
        for (let i = 0; i < 60; i++) {
            JIAZI.push(TIANGAN[i % 10] + DIZHI[i % 12]);
        }
        
        // 六甲旬首
        const XUNSHOU_MAP = {};
        const XUNSHOU_LIST = ['甲子', '甲戌', '甲申', '甲午', '甲辰', '甲寅'];
        for (let i = 0; i < 60; i++) {
            const xunIndex = Math.floor(i / 10);
            XUNSHOU_MAP[JIAZI[i]] = XUNSHOU_LIST[xunIndex];
        }
        
        // 旬首地支 - 修正为旬首六仪所在的宫位号
        // 甲辰壬在坎一宫，所以'甲辰': 1
        // 需要根据定局动态计算，这里先修正甲辰的值
        const XUNSHOU_DIZHI = {'甲子': 1, '甲戌': 6, '甲申': 7, '甲午': 9, '甲辰': 1, '甲寅': 8};
        
        // 马星（时支定）- hour是1-12，对应子丑寅...
        // 申子辰马在寅, 寅午戌马在申, 巳酉丑马在亥, 亥卯未马在巳
        const MAXING = {
            1: 3,   // 子→寅
            2: 12,  // 丑→亥
            3: 9,   // 寅→申
            4: 6,   // 卯→巳
            5: 3,   // 辰→寅
            6: 12,  // 巳→亥
            7: 9,   // 午→申
            8: 6,   // 未→巳
            9: 3,   // 申→寅
            10: 12, // 酉→亥
            11: 9,  // 戌→申
            12: 6   // 亥→巳
        };
        
        // 击刑
        const JIXING = {
            '甲': 3, // 震宫
            '戊': 3,
            '己': 2, // 坤宫
            '庚': 8, // 艮宫
            '辛': 8,
            '壬': 0, // 巽宫（无此宫，实际在4宫）
            '癸': 0,
            '乙': null, // 无
            '丙': null,
            '丁': null
        };
        
        // 门迫（门克宫）
        const MENKE = {
            '休门': [2, 5, 8], // 克土宫
            '生门': [1], // 克水宫
            '伤门': [6, 7], // 克金宫
            '杜门': [6, 7], // 克金宫
            '景门': [1], // 克水宫
            '死门': [1], // 克水宫
            '惊门': [3, 4], // 克木宫
            '开门': [3, 4] // 克木宫
        };
        
        // 宫位五行
        const GONG_WUXING = {1: '水', 2: '土', 3: '木', 4: '木', 5: '土', 6: '金', 7: '金', 8: '土', 9: '火'};
        
        // 门五行
        const MEN_WUXING = {
            '休门': '水', '生门': '土', '伤门': '木', '杜门': '木',
            '景门': '火', '死门': '土', '惊门': '金', '开门': '金'
        };
        
        // 入墓
        const RUMU = {
            '乙': 2, '丙': 6, '丁': 2, '戊': 6, '己': 6,
            '庚': 2, '辛': 6, '壬': 4, '癸': 2
        };
        
        // 空亡
        const KONGWANG = {
            '甲子': [10, 11], '甲戌': [8, 9], '甲申': [6, 7],
            '甲午': [4, 5], '甲辰': [2, 3], '甲寅': [0, 1]
        };
        
        // 吉格
        const JIGE = {
            '戊丙': '青龙返首', '丙戊': '飞鸟跌穴', '辛乙': '白虎猖狂',
            '乙辛': '青龙逃走', '癸丁': '腾蛇夭矫', '丁癸': '朱雀投江'
        };
        
        // ==================== 万年历自动计算（移植自wan_nian_li.py）====================
        
        // 基准日期：2025年9月1日 = 癸酉日
        const BASE_YEAR = 2025;
        const BASE_MONTH = 9;
        const BASE_DAY = 1;
        const BASE_GAN_INDEX = 9;  // 癸
        const BASE_ZHI_INDEX = 9;  // 酉
        
        // 各月天数（非闰年）
        const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        
        // 判断闰年
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }
        
        // 获取某月天数
        function getMonthDays(year, month) {
            if (month === 2 && isLeapYear(year)) {
                return 29;
            }
            return MONTH_DAYS[month - 1];
        }
        
        // 计算两个日期之间的天数差（目标日期 - 基准日期）
        function daysBetween(year1, month1, day1, year2, month2, day2) {
            // 如果目标日期在基准日期之前，交换参数并取负数
            if (year2 < year1 || (year2 === year1 && month2 < month1) || 
                (year2 === year1 && month2 === month1 && day2 < day1)) {
                return -daysBetween(year2, month2, day2, year1, month1, day1);
            }
            
            let days = 0;
            
            // 同年同月
            if (year1 === year2 && month1 === month2) {
                return day2 - day1;
            }
            
            // 同年不同月
            if (year1 === year2) {
                days += getMonthDays(year1, month1) - day1;
                for (let m = month1 + 1; m < month2; m++) {
                    days += getMonthDays(year1, m);
                }
                days += day2;
                return days;
            }
            
            // 不同年（year1 < year2）
            days += getMonthDays(year1, month1) - day1;
            for (let m = month1 + 1; m <= 12; m++) {
                days += getMonthDays(year1, m);
            }
            
            for (let y = year1 + 1; y < year2; y++) {
                days += isLeapYear(y) ? 366 : 365;
            }
            
            for (let m = 1; m < month2; m++) {
                days += getMonthDays(year2, m);
            }
            days += day2;
            
            return days;
        }
        
        // 计算日干支
        function getDayGanZhi(year, month, day) {
            const diff = daysBetween(BASE_YEAR, BASE_MONTH, BASE_DAY, year, month, day);
            const ganIndex = ((BASE_GAN_INDEX + diff) % 10 + 10) % 10;
            const zhiIndex = ((BASE_ZHI_INDEX + diff) % 12 + 12) % 12;
            return {
                gan: ganIndex,
                zhi: zhiIndex,
                ganZhi: TIANGAN[ganIndex] + DIZHI[zhiIndex]
            };
        }
        
        // ==================== 节气精确计算（Cope简化公式）====================
        
        // 节气基础数据（1900-2100年，黄经度数）
        // 简化版：使用已知的2023-2026年精确数据，其他年份用插值
        const JIEQI_DATABASE = {
            2023: {

        // 获取节气
        function getJieQi(year, month, day) {
            const data = JIEQI_DATABASE[year];
            if (!data) {
                return {name: '未知', type: 'yang'};
            }
            
            // 找到当前日期所在的节气区间
            const jieqiList = Object.entries(data).map(([name, [m, d]]) => ({
                name,
                month: m,
                day: d,
                type: ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种'].includes(name) ? 'yang' :
                      ['夏至', '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒'].includes(name) ? 'yin' : 'yang'
            }));
            
            // 按日期排序
            jieqiList.sort((a, b) => {
                if (a.month !== b.month) return a.month - b.month;
                return a.day - b.day;
            });
            
            // 找到最后一个不大于当前日期的节气
            for (let i = jieqiList.length - 1; i >= 0; i--) {
                const jq = jieqiList[i];
                if (jq.month < month || (jq.month === month && jq.day <= day)) {
                    return jq;
                }
            }
            
            // 如果都没找到，返回去年的最后一个节气
            return jieqiList[jieqiList.length - 1];
        }

            // 甲己之年丙作首, 乙庚之岁戊为头, 
            // 丙辛之岁寻庚上, 丁壬壬位顺行流,
            // 若问戊癸何处起, 甲寅之上好追求
            const startGanMap = [2, 4, 6, 8, 0, 2, 4, 6, 8, 0]; // 丙戊庚壬甲...
            const startGan = startGanMap[yearGZ.gan];
            
            // 根据节气确定月份偏移

            const gan = (startGan + monthOffset) % 10;

        function getYearGanZhi(year, hasLiChun = true) {

            let diff = year - baseYear;
            if (!hasLiChun) {

            const ganIndex = ((baseGan + diff) % 10 + 10) % 10;
            const zhiIndex = ((baseZhi + diff) % 12 + 12) % 12;
            
            return {

                zhi: zhiIndex,
                ganZhi: TIANGAN[ganIndex] + DIZHI[zhiIndex]

            const menOrder = ['休门', '生门', '伤门', '杜门', '景门', '死门', '惊门', '开门'];
            const zhiShiIndex = menOrder.indexOf(zhiFuInfo.zhiShiMen);
            
            // 地支顺序：寅→卯→辰→巳→午→未→申→酉→戌→亥→子→丑（用于排宫位）
            const diZhiOrder = ['寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥', '子', '丑'];
            // 标准地支顺序（用于hourZhi转地支名）
            const standardDiZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
            
            const diZhiIdx = diZhiOrder.indexOf(zhiFuInfo.xunShou.slice(0, 2)[1]); // 取"甲辰壬"中的"辰"
            const hourZhiName = standardDiZhi[hourZhi - 1]; // hourZhi 1-12 转地支名（1=子, 7=午）
            
            // 旬首地支序号 = 旬首宫宫位号（中五宫寄坤二宫）
            let xunShouNum = zhiFuInfo.xunShouGong;
            if (xunShouNum === 5) {
                xunShouNum = 2; // 中五宫寄坤二宫
            }
            
            // 给每个地支分配宫位（阳顺阴逆）
            const diZhiToGong = {};
            for (let i = 0; i < 12; i++) {
                let gong;
                if (isYang) {
                    gong = ((xunShouNum - 1 + i) % 9) + 1;
                } else {
                    gong = ((xunShouNum - 1 - i + 9) % 9) + 1;
                }
                // 跳过中五宫（5宫）
                if (gong === 5) {
                    if (isYang) {
                        gong = 6;
                    } else {
                        gong = 4;
                    }
                }
                const dz = diZhiOrder[(diZhiIdx + i) % 12];
                diZhiToGong[dz] = gong;
            }
            
            // 时辰地支对应的宫位就是值使门落宫
            const zhiShiGong = diZhiToGong[hourZhiName];
            
            // 从值使门落宫开始，顺时针排八门
            const startIndex = CLOCKWISE_ORDER.indexOf(zhiShiGong);
            
            for (let i = 0; i < 8; i++) {
                const gongIndex = (startIndex + i) % 8;
                const gong = CLOCKWISE_ORDER[gongIndex];
                const menIdx = (zhiShiIndex + i) % 8;
                baMen[gong] = menOrder[menIdx];
            }
            
            return {baMen, zhiShiGong};
        }
        
        // 排隐干（修正版 - 处理甲隐遁）
        function paiYinGan(zhiShiGong, diPan, hourGanZhi, isYang, xunShou) {
            const yinGan = {};
            let hourGan = hourGanZhi[0]; // 起局时辰的天干
            
            // 处理甲隐遁：如果时干是甲，用旬首的六仪代替
            // 甲隐于戊(甲子旬)、己(甲戌旬)、庚(甲申旬)、辛(甲午旬)、壬(甲辰旬)、癸(甲寅旬)
            if (hourGan === '甲') {
                // 从旬首获取六仪（xunShou格式如"甲戌己"）
                hourGan = xunShou.slice(2); // 取第三个字符，如"己"
            }
            
            // 隐干顺序：戊(1)→己(2)→庚(3)→辛(4)→壬(5)→癸(6)→丁(7)→丙(8)→乙(9)
            const yinGanOrder = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
            
            // 数字顺序：1坎→2坤→3震→4巽→5中→6乾→7兑→8艮→9离
            const numOrder = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            
            // 值使门落宫的地盘干
            const zhiShiDiPanGan = diPan[zhiShiGong];
            
            // 确定时干起点
            let startIdx; // 在numOrder中的索引
            // 检查值使宫地盘干是否等于时干（考虑组合地盘干如"乙癸"）
            if (zhiShiDiPanGan && zhiShiDiPanGan.includes(hourGan)) {
                // 情况一：值使宫地盘干包含时干 → 时干在值使宫
                startIdx = numOrder.indexOf(parseInt(zhiShiGong));
            } else {
                // 情况二：值使宫地盘干不包含时干 → 时干在中五（序号5）
                startIdx = 4; // 中五是numOrder的第5个元素，索引4
            }
            
            // 从时干开始，按顺序填入各宫
            for (let i = 0; i < 9; i++) {
                // 确定当前宫序号
                let gongIdx;
                if (isYang) {
                    // 阳遁：数字顺序1→9
                    gongIdx = (startIdx + i) % 9;
                } else {
                    // 阴遁：数字顺序9→1（即反向）
                    gongIdx = (startIdx - i + 9) % 9;
                }
                const gongNum = numOrder[gongIdx];
                
                // 确定隐干（从时干开始，按戊己庚辛壬癸丁丙乙顺序）
                const ganIdx = (yinGanOrder.indexOf(hourGan) + i) % 9;
                yinGan[gongNum] = yinGanOrder[ganIdx];
            }
            
            return yinGan;
        }
        
        // 检测四害
        function checkSiHai(gong, diPanGan, tianPanGan, men, star, yinGan) {
            const sihai = [];
            
            // 门迫
            if (men && MENKE[men] && MENKE[men].includes(gong)) {
                sihai.push('门迫');
            }
            
            // 击刑
            if (tianPanGan && JIXING[tianPanGan] === gong) {
                sihai.push('击刑');
            }
            
            // 入墓
            if (tianPanGan && RUMU[tianPanGan] === gong) {
                sihai.push('入墓');
            }
            
            // 伏吟（天盘干=地盘干）
            if (tianPanGan && diPanGan && tianPanGan === diPanGan) {
                sihai.push('伏吟');
            }
            
            return sihai;
        }
        
        // 检测格局
        function checkGeJu(tianPanGan, diPanGan) {
            if (!tianPanGan || !diPanGan) return null;
            const key = tianPanGan + diPanGan;
            return JIGE[key] || null;
        }
        
        // 主排盘函数
        function qiPan() {
            const dateInput = document.getElementById('date').value;
            const [y, m, d] = dateInput.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const hour = parseInt(document.getElementById('hour').value);
            
            // 使用新的精确计算方法
            // 先获取节气（使用新的数据库）
            const jieQi = getJieQi(y, m, d);
            
            // 四柱（使用新的计算函数）
            const yearGZ = getYearGanZhi(y, jieQi.name !== '立春' && jieQi.name !== '雨水' && jieQi.name !== '惊蛰');
            const monthGZ = getMonthGanZhi(y, m, d);
            const dayGZ = getDayGanZhi(y, m, d);
            const hourGZ = getHourGanZhi(dayGZ.gan, hour - 1); // hour 1-12 转 0-11
            
            // 显示四柱
            const sizhuRow = document.getElementById('sizhuRow');
            sizhuRow.innerHTML = `
                <div class="sizhu-item"><div class="label">年柱</div><div class="value">${yearGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">月柱</div><div class="value">${monthGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">日柱</div><div class="value">${dayGZ.ganZhi}</div></div>
                <div class="sizhu-item"><div class="label">时柱</div><div class="value">${hourGZ.ganZhi}</div></div>
            `;
            
            // 定局
            const juInfo = determineJuShu(jieQi, dayGZ.ganZhi);
            
            // 排地盘
            const diPan = paiDiPan(juInfo.ju, juInfo.isYang);
            
            // 找值符值使
            console.log('qiPan - hourGZ.ganZhi:', hourGZ.ganZhi);
            const zhiFuInfo = findZhiFuZhiShi(hourGZ.ganZhi, diPan);
            
            // 排九星（先排星，不排天盘干）
            const {tianPan, hourGanGong} = paiTianPan(hourGZ.ganZhi, diPan, zhiFuInfo, juInfo.isYang);
            
            // 排八神（从值符实际落宫开始）
            const baShen = paiBaShen(zhiFuInfo.zhiFuGong, juInfo.isYang);
            
            // 排八门
            const {baMen, zhiShiGong} = paiBaMen(zhiFuInfo, hour, juInfo.isYang);
            
            // 排天盘干（在九星和八门之后）
            paiTianPanGan(tianPan, zhiFuInfo, diPan, juInfo.isYang);
            
            // 排隐干（传入旬首以处理甲隐遁）
            const yinGan = paiYinGan(zhiShiGong, diPan, hourGZ.ganZhi, juInfo.isYang, zhiFuInfo.xunShou);
            
            // 马星
            const maXingZhi = MAXING[hour]; // 1-12序号
            const maXingGong = Object.keys(diPan).find(k => DIZHI.indexOf(diPan[k]) + 1 === maXingZhi);
            
            // 保存数据
            currentPanData = {
                sizhu: {year: yearGZ, month: monthGZ, day: dayGZ, hour: hourGZ},
                jieQi,
                juInfo,
                zhiFuInfo,
                diPan,
                tianPan,
                baShen,
                baMen,
                yinGan,
                maXing: DIZHI[maXingZhi - 1],
                isYang: juInfo.isYang
            };
            
            // 显示信息
            document.getElementById('jieqi').textContent = jieQi.name;
            document.getElementById('jushu').textContent = `${juInfo.type}${juInfo.ju}局`;
            document.getElementById('xunshou').textContent = zhiFuInfo.xunShou;
            document.getElementById('zhifu').textContent = zhiFuInfo.zhiFuXing;
            document.getElementById('zhishi').textContent = zhiFuInfo.zhiShiMen;
            document.getElementById('maxing').textContent = DIZHI[maXingZhi - 1];
            
            // 显示四害
            const sihaiGrid = document.getElementById('sihaiGrid');
            sihaiGrid.innerHTML = `
                <div class="sihai-item"><strong>门迫</strong><br>门克宫</div>
                <div class="sihai-item"><strong>击刑</strong><br>地支刑</div>
                <div class="sihai-item"><strong>入墓</strong><br>天干墓</div>
                <div class="sihai-item"><strong>伏吟</strong><br>天地同</div>
            `;
            
            document.getElementById('infoSection').classList.add('active');
            
            // 渲染九宫
            renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo);
            
            document.getElementById('panSection').classList.add('active');
        }
        
        // 渲染盘面
        function renderPan(diPan, tianPan, baShen, baMen, yinGan, zhiFuInfo) {
            const container = document.getElementById('panContainer');
            container.innerHTML = '';
            
            const gongPositions = [4, 9, 2, 3, 5, 7, 8, 1, 6];
            
            gongPositions.forEach(gongNum => {
                const gong = document.createElement('div');
                gong.className = 'gong' + (gongNum === 5 ? ' zhong' : '');
                
                const tp = tianPan[gongNum] || {};
                const star = tp.star || '';
                const tpGan = tp.gan || '';
                const dpGan = diPan[gongNum] || '';
                
                const shen = baShen[gongNum] || '';
                const men = baMen[gongNum] || '';
                // 修复：同时尝试数字和字符串类型的键
                const yg = yinGan[gongNum] || yinGan[String(gongNum)] || '';
                
                // 检测四害
                const sihai = checkSiHai(gongNum, dpGan, tpGan, men, star, yg);
                const geju = checkGeJu(tpGan, dpGan);
                
                if (sihai.includes('门迫')) gong.classList.add('menpo');
                if (sihai.includes('击刑') || sihai.includes('入墓')) gong.classList.add('jixing');
                if (gongNum === zhiFuInfo.zhiFuGong) gong.classList.add('zhifu');
                
                // 新布局：
                // 第一行：八神
                // 第二行：隐干 | 九星 | 天盘干
                // 第三行：八门 | 地盘干
                
                gong.innerHTML = `
                    <div class="row1">${shen}</div>
                    <div class="row2">
                        <span class="yg-left">${yg}</span>
                        <span class="star-center">${star}</span>
                        <span class="tp-right">${tpGan}${sihai.includes('击刑') ? '刑' : ''}${sihai.includes('入墓') ? '墓' : ''}</span>
                    </div>
                    <div class="row3">
                        <span class="men-left ${sihai.includes('门迫') ? 'menpo' : ''}">${men}${sihai.includes('门迫') ? '迫' : ''}</span>
                        <span class="dp-right">${dpGan}</span>
                    </div>
                    ${geju ? `<div class="geju-new">${geju}</div>` : ''}
                `;
                
                container.appendChild(gong);
            });
        }
        
        // 导出盘面
        function exportPan() {
            if (!currentPanData) {
                alert('请先起盘！');
                return;
            }
            
            const data = currentPanData;
            const gongNames = {1: '坎一宫(北)', 2: '坤二宫(西南)', 3: '震三宫(东)', 4: '巽四宫(东南)', 
                              5: '中五宫', 6: '乾六宫(西北)', 7: '兑七宫(西)', 8: '艮八宫(东北)', 9: '离九宫(南)'};
            const gongOrder = [4, 9, 2, 3, 5, 7, 8, 1, 6]; // 九宫格显示顺序
            
            let output = `==============================================\n`;
            output += `         奇门遁甲排盘 - 完整盘面\n`;
            output += `==============================================\n`;
            output += `导出时间: ${new Date().toLocaleString()}\n\n`;
            
            output += `【四柱八字】\n`;
            output += `年柱: ${data.sizhu.year.ganZhi}\n`;
            output += `月柱: ${data.sizhu.month.ganZhi}\n`;
            output += `日柱: ${data.sizhu.day.ganZhi} (日干:${data.sizhu.day.gan})\n`;
            output += `时柱: ${data.sizhu.hour.ganZhi} (时干:${data.sizhu.hour.gan})\n\n`;
            
            output += `【局信息】\n`;
            output += `节气: ${data.jieQi.name}\n`;
            output += `局数: ${data.juInfo.type}${data.juInfo.ju}局\n`;
            output += `旬首: ${data.zhiFuInfo.xunShou}\n`;
            output += `值符: ${data.zhiFuInfo.zhiFuXing}\n`;
            output += `值使: ${data.zhiFuInfo.zhiShiMen}\n`;
            output += `马星: ${data.maXing}\n\n`;
            
            output += `【交易用神速查】\n`;
            output += `日干(股价): ${data.sizhu.day.gan} - 需查所在宫位\n`;
            output += `时干(时机): ${data.sizhu.hour.gan} - 需查所在宫位\n`;
            output += `值符(大势): ${data.zhiFuInfo.zhiFuXing}\n`;
            output += `乙奇(买盘): 需查所在宫位\n`;
            output += `庚金(卖盘): 需查所在宫位\n\n`;
            
            output += `==============================================\n`;
            output += `              九宫格完整盘面\n`;
            output += `==============================================\n\n`;
            
            // 按九宫格顺序输出每个宫的信息
            gongOrder.forEach(gongNum => {
                const tp = data.tianPan[gongNum] || {};
                const star = tp.star || '';
                const tpGan = tp.gan || '';
                const dpGan = data.diPan[gongNum] || '';
                const shen = data.baShen[gongNum] || '';
                const men = data.baMen[gongNum] || '';
                const yg = data.yinGan[gongNum] || data.yinGan[String(gongNum)] || '';
                const isZhiFuGong = (gongNum == data.zhiFuInfo.zhiFuGong) ? ' [值符宫]' : '';
                
                output += `【${gongNames[gongNum]}${isZhiFuGong}】\n`;
                output += `  八神: ${shen || '无'}\n`;
                output += `  天盘: ${tpGan || '无'} (${star || '无'})\n`;
                output += `  地盘: ${dpGan || '无'}\n`;
                output += `  八门: ${men || '无'}\n`;
                output += `  隐干: ${yg || '无'}\n\n`;
            });
            
            output += `==============================================\n`;
            output += `【地盘干全表】\n`;
            output += `==============================================\n`;
            for (let i = 1; i <= 9; i++) {
                output += `${gongNames[i]}: ${data.diPan[i] || '无'}\n`;
            }
            
            console.log(output);
            
            // 创建下载
            const blob = new Blob([output], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `奇门排盘_${data.sizhu.day.ganZhi}_${data.sizhu.hour.ganZhi}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
