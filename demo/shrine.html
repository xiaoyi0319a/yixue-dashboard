<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>神龛小样</title>
<style>
  body { margin:0; background: radial-gradient(ellipse at 50% 30%, #101c38 0%, #05080f 60%, #03050a 100%); height:100vh; overflow:hidden; }
  #stage { position: relative; width: 480px; height: 100vh; margin: 0 auto; }
  #shrine-svg { position:absolute; inset:0; width:100%; height:100%; }
  #img-wrap { position:absolute; left:50%; top:50%; width: 300px; height:505px; transform: translate(-50%,-52%);
    background: linear-gradient(180deg,#b89858 0%,#8a6f42 55%,#6a5430 100%); border-radius:3px; overflow:hidden;
    box-shadow: 0 0 30px rgba(230,190,110,.28) inset; }
  #deity-img { width:100%; height:100%; object-fit:cover; mix-blend-mode:multiply;
    filter: sepia(.12) saturate(1.3) contrast(1.06) brightness(1.35); }
  #particles { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .cap { position:absolute; bottom:4vh; left:0; right:0; text-align:center; color:#c9a86a;
    font-family:"Noto Serif SC","Songti SC",serif; letter-spacing:.4em; font-size:18px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="particles"></canvas>
  <div id="img-wrap"><img id="deity-img" src="deity.png" alt=""></div>
  <svg id="shrine-svg" viewBox="0 0 480 800" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6c987"/><stop offset="50%" stop-color="#c9a86a"/><stop offset="100%" stop-color="#8a6f3a"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#gold)" id="frame"></g>
    <g id="plaque"></g>
  </svg>
  <div class="cap">值 符 · 今 日 值 守</div>
</div>
<script>
/* 神龛火焰形拱框：程序化 scallop + 双层描金 + 底座云纹 */
(function(){
  var g = document.getElementById('frame');
  var cx = 240, top = 60, W = 200, H = 620;  /* 龛外廓 */
  var N = 9, scallops = '';
  for (var i = 0; i <= N; i++) {
    var t = i / N;
    var x = cx - W + 2 * W * t;
    var y = top + Math.sin(Math.PI * t) * 0; /* 顶边弧线另算 */
    scallops += '';
  }
  /* 顶：五瓣莲拱 */
  var arch = 'M' + (cx - W) + ',' + (top + 90);
  arch += ' Q' + (cx - W) + ',' + (top + 10) + ' ' + (cx - W/2) + ',' + (top + 6);
  arch += ' Q' + (cx - W/4) + ',' + (top - 26) + ' ' + cx + ',' + (top - 6);
  arch += ' Q' + (cx + W/4) + ',' + (top - 26) + ' ' + (cx + W/2) + ',' + (top + 6);
  arch += ' Q' + (cx + W) + ',' + (top + 10) + ' ' + (cx + W) + ',' + (top + 90);
  /* 两侧柱 + 底 */
  var body = ' L' + (cx + W) + ',' + (top + H - 70);
  body += ' Q' + (cx + W) + ',' + (top + H) + ' ' + (cx + W - 46) + ',' + (top + H);
  body += ' L' + (cx - W + 46) + ',' + (top + H);
  body += ' Q' + (cx - W) + ',' + (top + H) + ' ' + (cx - W) + ',' + (top + H - 70);
  body += ' Z';
  var p1 = document.createElementNS('http://www.w3.org/2000/svg','path');
  p1.setAttribute('d', arch + body);
  p1.setAttribute('stroke-width','3.5');
  p1.setAttribute('opacity','0.95');
  g.appendChild(p1);
  /* 内框 */
  var p2 = document.createElementNS('http://www.w3.org/2000/svg','path');
  var ix = 14;
  p2.setAttribute('d', arch + body); /* 同形缩放靠 transform */
  p2.setAttribute('transform','translate(' + cx + ',' + (top+H/2) + ') scale(0.93) translate(' + (-cx) + ',' + (-(top+H/2)) + ')');
  p2.setAttribute('stroke-width','1.2');
  p2.setAttribute('opacity','0.55');
  g.appendChild(p2);
  /* 柱身云纹螺旋（左右各三朵卷云） */
  function cloud(x, y, s, flip) {
    return 'M' + x + ',' + y +
      ' a' + 10*s + ',' + 10*s + ' 0 1,' + (flip?1:0) + ' ' + 18*s + ',' + (-4*s) +
      ' a' + 7*s + ',' + 7*s + ' 0 1,' + (flip?0:1) + ' ' + (-6*s) + ',' + (-8*s);
  }
  var cl = '';
  for (var j = 0; j < 3; j++) {
    cl += cloud(cx - W + 16, top + 180 + j * 150, 0.9, false) + ' ';
    cl += cloud(cx + W - 16, top + 240 + j * 150, 0.9, true) + ' ';
  }
  var pc = document.createElementNS('http://www.w3.org/2000/svg','path');
  pc.setAttribute('d', cl);
  pc.setAttribute('stroke-width','1.6');
  pc.setAttribute('opacity','0.5');
  g.appendChild(pc);
  /* 匾额 */
  var pg = document.getElementById('plaque');
  var r = document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x', cx-64); r.setAttribute('y', top+26); r.setAttribute('width',128); r.setAttribute('height',38);
  r.setAttribute('rx',6); r.setAttribute('fill','#120d04'); r.setAttribute('stroke','url(#gold)'); r.setAttribute('stroke-width','2');
  pg.appendChild(r);
  var t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', cx); t.setAttribute('y', top+53); t.setAttribute('text-anchor','middle');
  t.setAttribute('fill','#e6c987'); t.setAttribute('font-size','24');
  t.setAttribute('font-family','"Noto Serif SC","Songti SC",serif');
  t.setAttribute('letter-spacing','8');
  t.textContent = '值符';
  pg.appendChild(t);
})();

/* 香火粒子：金烬上升 + 环绕萤光 + 值符周身光晕呼吸 */
(function(){
  var cv = document.getElementById('particles'), ctx = cv.getContext('2d');
  var W, H;
  function resize(){ var r = cv.parentElement.getBoundingClientRect(); W = cv.width = r.width; H = cv.height = r.height; }
  resize(); window.addEventListener('resize', resize);
  function P(){ this.reset(true); }
  P.prototype.reset = function(init){
    this.x = W/2 + (Math.random()-0.5)*220;
    this.y = init ? Math.random()*H : H + 10;
    this.vy = -(0.25 + Math.random()*0.7);
    this.vx = (Math.random()-0.5)*0.2;
    this.r = 0.6 + Math.random()*1.8;
    this.life = 0;
    this.max = 300 + Math.random()*300;
    this.hue = 38 + Math.random()*14;
    this.type = Math.random() < 0.14 ? 'fly' : 'ember';
    if (this.type === 'fly') { this.orbit = 120 + Math.random()*70; this.ang = Math.random()*Math.PI*2; this.spd = (Math.random()<0.5?-1:1)*(0.002+Math.random()*0.004); }
  };
  P.prototype.step = function(){
    this.life++;
    if (this.type === 'ember') {
      this.x += this.vx + Math.sin((this.y+this.life)/30)*0.25;
      this.y += this.vy;
    } else {
      this.ang += this.spd;
      this.x = W/2 + Math.cos(this.ang)*this.orbit;
      this.y = H*0.45 + Math.sin(this.ang)*this.orbit*0.42 + Math.sin(this.life/50)*8;
    }
    if (this.life > this.max || this.y < -12) this.reset(false);
  };
  P.prototype.draw = function(){
    var a = Math.min(1, this.life/40) * Math.max(0, 1 - this.life/this.max);
    ctx.beginPath();
    var grd = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*4);
    grd.addColorStop(0, 'hsla(' + this.hue + ',85%,72%,' + (0.85*a) + ')');
    grd.addColorStop(1, 'hsla(' + this.hue + ',85%,60%,0)');
    ctx.fillStyle = grd;
    ctx.arc(this.x, this.y, this.r*4, 0, 7);
    ctx.fill();
  };
  var ps = [];
  for (var i = 0; i < 90; i++) ps.push(new P());
  var t0 = 0;
  (function loop(t){
    requestAnimationFrame(loop);
    ctx.clearRect(0,0,W,H);
    /* 光晕呼吸 */
    var breath = 0.5 + Math.sin(t/900)*0.12;
    var g2 = ctx.createRadialGradient(W/2, H*0.45, 10, W/2, H*0.45, 260);
    g2.addColorStop(0, 'rgba(230,190,110,' + (0.14*breath) + ')');
    g2.addColorStop(1, 'rgba(230,190,110,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0,0,W,H);
    for (var i = 0; i < ps.length; i++) { ps[i].step(); ps[i].draw(); }
  })(0);
})();
</script>
</body>
</html>
