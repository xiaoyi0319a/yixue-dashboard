<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个股报告库 | 羿学交易智囊团</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a2332 100%);
            color: #e0e6ed;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center; padding: 30px 0;
            border-bottom: 1px solid #2d3a4f; margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #00d4ff, #a371f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #8b9dc3; font-size: 1em; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #00d4ff; text-decoration: none; font-size: 0.95em; }
        .back-link:hover { text-decoration: underline; }

        .stock-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2d3a4f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: inherit;
        }
        .stock-card:hover {
            transform: translateY(-3px);
            border-color: #3d4a5f;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .stock-code {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #a371f7;
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
            min-width: 100px;
        }
        .stock-code .code { color: #a371f7; font-size: 1.3em; font-weight: bold; }
        .stock-code .market { color: #8b9dc3; font-size: 0.8em; margin-top: 4px; }
        .stock-info { flex: 1; }
        .stock-info h3 { color: #f0f4f8; font-size: 1.2em; margin-bottom: 8px; }
        .stock-info p { color: #a0aec0; font-size: 0.9em; }
        .stock-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 8px;
        }
        .tag-medium { background: rgba(255,215,0,0.15); color: #ffd700; border: 1px solid rgba(255,215,0,0.3); }
        .tag-low { background: rgba(139,157,195,0.15); color: #8b9dc3; border: 1px solid rgba(139,157,195,0.3); }
        .tag-high { background: rgba(255,107,107,0.2); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
        .stock-date { color: #5a6a7a; font-size: 0.85em; min-width: 80px; text-align: right; }

        .footer {
            text-align: center; padding: 30px 0;
            border-top: 1px solid #2d3a4f; margin-top: 30px;
            color: #5a6a7a; font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 返回首页</a>
        
        <div class="header">
            <h1>📚 个股报告库</h1>
            <div class="subtitle">羿学交易智囊团 | 深度个股分析报告归档</div>
        </div>

        <a href="301487.html" class="stock-card">
            <div class="stock-code">
                <div class="code">301487</div>
                <div class="market">创业板</div>
            </div>
            <div class="stock-info">
                <h3>盟固利</h3>
                <p>锂电池正极材料（钴酸锂+三元），业绩V型反转+磷酸铁锂扩产</p>
                <span class="stock-tag tag-medium">中价值</span>
                <span class="stock-tag tag-low">翻倍基因不足</span>
            </div>
            <div class="stock-date">2026-05-21</div>
        </a>

        <!-- 更多报告将在此处追加 -->

        <div class="footer">
            <p>🎯 羿学交易智囊团 | 个股报告库</p>
            <p>报告持续更新中 | 预测仅供参考，不构成投资建议</p>
        </div>
    </div>
</body>
</html>
