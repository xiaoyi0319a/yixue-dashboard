# Jekyll Configuration for 羿学交易报告库
title: "羿学天天看"
description: "个股分析报告库 | 奇门预测 | 预期差挖掘"
url: "https://xiaoyi0319a.github.io"
baseurl: "/yixue-dashboard"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  reports:
    output: true
    permalink: /stock-:name.html

# Defaults
defaults:
  - scope:
      path: ""
      type: "reports"
    values:
      layout: "report"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - ".git"

# GitHub Pages specific
safe: true
incremental: false
